.DY_processors: &DY_processors
  - name: Stitcher
    module: FLAF.Processors.MCStitching
    class: MCStitcher
    config: FLAF/config/Processors/stitching_DY_amcatnlo_Vpt_NpNLO.yaml
    # A stitcher writes its denominator into the anaCache at AnaTuple and has to be present
    # at AnaTupleMerge to combine it again; only these two stages are ever looked up.
    stages: [ AnaTuple, AnaTupleMerge ]
    dependency_level:
      AnaTuple: file
      AnaTupleMerge: process

.DY_processors_allFlavors: &DY_processors_allFlavors
  - name: Stitcher
    module: FLAF.Processors.MCStitching
    class: MCStitcher
    config: FLAF/config/Processors/stitching_DY_amcatnlo_Vpt_NpNLO_allFlavors.yaml
    stages: [ AnaTuple, AnaTupleMerge ]
    verbose: 1
    dependency_level:
      AnaTuple: file
      AnaTupleMerge: process

.W_processors_allFlavors: &W_processors_allFlavors
  - name: Stitcher
    module: FLAF.Processors.MCStitching
    class: MCStitcher
    config: FLAF/config/Processors/stitching_W_amcatnlo_Vpt_NpNLO.yaml
    stages: [ AnaTuple, AnaTupleMerge ]
    verbose: 1
    dependency_level:
      AnaTuple: file
      AnaTupleMerge: process

# Single-lepton fakes (Analysis/SL_fakes.py): estimated in the merge of each TwoStageDNN_M<MX>_binary
# from the HME sub-regions of Signal_Extraction_SL_window (FLAF data-driven process, no datasets):
# Fakes = max(f, 0) x TT in the SL window SR_SL_HMESub_m<MX>, f the excess of data over the
# simulation in TT units, measured below and from the split of the DNN separately.
Fakes:
  name: "Non-prompt leptons"
  color: kGray+1
  data_driven:
    estimator: Analysis.SL_fakes.estimate
    nuisances:
      FakesStatLow: CMS_bbww_SL_fakes_stat_low_{channel}_{category}_{era}_{}
      FakesStatHigh: CMS_bbww_SL_fakes_stat_high_{channel}_{category}_{era}_{}
      FakesMethodLow: CMS_bbww_SL_fakes_method_low_{channel}_{category}_{}
      FakesMethodHigh: CMS_bbww_SL_fakes_method_high_{channel}_{category}_{}
    variable: TwoStageDNN_M{mass}_binary
    hme_variable: DeepHME_mass  # the variable of the windows and sidebands
    iso: SR_SL
    anti: SR_SL_Fakeable
    window: HMESub
    sidebands: HMESB
    tt_process: { Run3_Model: TT, Run3_Model_DYSplit: TT, TestModel: custom_CI_Background_TT }
    # a region group with less TT than this (weighted events) does not determine f: Fakes = 0 in the cell
    min_tt: 1.0
    # (user, 2026-11-18) f is measured separately below and from this DNN logit, a bin edge of
    # TwoStageDNN_M<MX>_binary: the cuts of the 2026-11-10 study (other windows, 0.6-logit grid)
    # moved to the nearest 0.5 edge.
    # 1200, 1300, 1500: -3.5 as at 1400 (user, 2026-11-20): the study's cuts there (-8.0, -11.5, -12.5)
    # left the low part of the HME sidebands without TT, so f was not determined in any cell.
    split:
      250: -1.0
      260: -0.5
      270: -2.5
      280: -1.0
      300: -2.0
      320: -1.0
      350: -2.0
      360: -2.0
      400: -2.0
      450: -1.0
      500: -2.5
      550: -3.0
      600: -3.0
      650: -2.5
      700: -0.5
      750: -3.0
      800: -2.0
      850: -1.0
      900: -3.0
      1000: -1.0
      1100: -0.5
      1200: -3.5
      1300: -3.5
      1400: -3.5
      1500: -3.5
    # (user, 2026-11-18) V (SR_SL_Fakeable) up to 400 GeV, where the lower sidebands
    # are missing or on the DeepHME turn-on, H (HME sidebands) above; FakesMethod = the other one.
    scheme:
      250: V
      260: V
      270: V
      280: V
      300: V
      320: V
      350: V
      360: V
      400: V
      450: H
      500: H
      550: H
      600: H
      650: H
      700: H
      750: H
      800: H
      850: H
      900: H
      1000: H
      1100: H
      1200: H
      1300: H
      1400: H
      1500: H

# DY above 50 GeV on its own, for Run3_Model_DYSplit: beside DY_M_10to50 it is the DY of
# Run3_Model split by mass. Every era defines DYto2L_InclusivePlusBinned.
DY_M_50:
  name: "DY M50"
  color: "kAzure+7"
  sub_processes:
    - DYto2L_InclusivePlusBinned
