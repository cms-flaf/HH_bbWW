[modules]
FLAF.AnaProd.tasks
FLAF.Analysis.tasks
FLAF.RunKit.grid_helper_tasks
inference.dhi.tasks
Studies.DNN.tasks
Studies.ModelValidation.tasks
StatInference.law.tasks

[job]
job_file_dir: $ANALYSIS_PATH/data/jobs
job_file_dir_cleanup: False
# CRAB (law.contrib.cms): CMSSW sandbox used by the CRAB client on the submit node.
# Analysis outputs use fs_default; CRAB's own storageSite/outLFNDirBase are a fixed FLAF placeholder.
# Optional site lists: config/global.yaml crab: (see FLAF docs: workflow/crab.md).
crab_sandbox_name: CMSSW_14_0_0::arch=el9_amd64_gcc12

[logging]
luigi-interface: INFO

[luigi_core]
local_scheduler: True
no_lock: True
# scheduler_host: cms-flaf.cern.ch

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0
check_unfulfilled_deps: False
check_complete_on_run: False
cache_task_completion: True

[luigi_scheduler]
retry_count: 0

# dhi fits (one job per mass for limits, per nuisance for impacts). Their workflow follows the
# StatInference task's --workflow (StatInference law/dhi_workflow.py): --workflow htcondor sends
# them to HTCondor like the FLAF tasks, --workflow local (the integration CI) fits locally.
# getenv: a condor job runs in the submitting shell's FLAF environment (flaf_env, combine in
# soft/, inference/ -- all on AFS) instead of dhi's standalone bootstrap, which needs its own
# software bundles and never submitted with FLAF's environment.
[luigi_ResonantLimits]
htcondor_getenv: True

[luigi_PullsAndImpacts]
htcondor_getenv: True
