fs_default:
  - /builds/cms-flaf/flaf_integration/output/HH_bbWW

analysis_config_area: config
compute_unc_variations: true
compute_unc_histograms: true
store_noncentral: true
phys_model: TestModel

QCDRegions:
  - OS_Iso
  # The single-lepton signal region of the MX=300 hypothesis, read by CI_card_SL.yaml.
  - SR_SL_M300

StatInference:
  # Both CI cards, SL and DL, and their combination.
  config: config/Datacards/CI_card_combined.yaml
  # hist_bins is unset: both CI cards rebin in their `preprocess:` step (CI_binning_2d.yaml).
  param_values: [ 300 ]

