fs_default:
  - /builds/cms-flaf/flaf_integration/output/HH_bbWW

analysis_config_area: config
compute_unc_variations: true
compute_unc_histograms: true
store_noncentral: true
phys_model: TestModel
# The trimmed variable set in global.yaml; `default` runs the CI pod out of memory. Its regions
# (OS_Iso, SR_SL and SR_SL_Fakeable) are the flavour's.
histTuple_flavor: CI

StatInference:
  # Both CI cards, each with its own datacards and limit, as the analysis lists its cards.
  # They share CI_common.yaml through `include:`, so the CI also exercises the include merge.
  #   CI_DL: the double-lepton card, the 1D DNN_M300_Signal
  #   CI_SL: the single-lepton card, the binary score TwoStageDNN_M300_binary
  # Both read the CI sub-region OS_Iso_CISub_m300 (the whole HME range, CI flavour in
  # global.yaml) through their input_categories, as the DL cards read HMESub, with no preprocess
  # step and one bin per channel and category (their own hist_bins). hist_bins is unset here.
  cards:
    CI_DL: config/Datacards/CI/CI_card_DL.yaml
    CI_SL: config/Datacards/CI/CI_card_SL.yaml
  param_values: [ 300 ]

