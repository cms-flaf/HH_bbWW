fs_default:
  - /builds/cms-flaf/flaf_integration/output/HH_bbWW

analysis_config_area: config
compute_unc_variations: true
compute_unc_histograms: true
store_noncentral: true
phys_model: TestModel
# The trimmed variable set in global.yaml; `default` runs the CI pod out of memory.
histTuple_flavor: CI

QCDRegions:
  - OS_Iso
  # The mass-independent single-lepton signal region of the two-stage DNN. Produced and
  # plotted; the CI_SL card reads the looser OS_Iso (see CI/CI_card_SL.yaml).
  - SR_SL

StatInference:
  # Both CI cards, each with its own datacards and limit, as the analysis lists its cards.
  # They share CI_common.yaml through `include:`, so the CI also exercises the include merge.
  #   CI_DL: the double-lepton card, with the `preprocess:` step (rebin_2d.py, one bin per
  #          channel and category, per CI/CI_binning_2d.yaml)
  #   CI_SL: the single-lepton card, read from OS_Iso through its input_categories;
  #          no preprocess step, it sets its own hist_bins
  # hist_bins is unset here, as in global.yaml.
  cards:
    CI_DL: config/Datacards/CI/CI_card_DL.yaml
    CI_SL: config/Datacards/CI/CI_card_SL.yaml
  param_values: [ 300 ]

