analysis: hh_bbww
type: resonant
# The 1D counterpart of x_hh_bbww_DL_run3.yaml: it reads the per-mass 1D DNN score
# variables (Hists_merged/<era>/DNN_M<mass>_Signal/) directly, rather than the sliced
# shapes bin_opt_2d/rebin_2d.py produces from the 2D DNN-vs-HME plane. Everything below
# `hist_bins` is identical to the 2D configuration, so the two can be compared like for
# like.
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_M${MX}_Signal/DNN_M${MX}_Signal.root
signalFractionForRelevantBins: 0.2

# Applied by dc_make/binner.py to every nominal and systematic shape. The input carries
# 100 bins over [-15, 15]; both edges here sit on that 0.3-wide grid, which is what
# rebinAndFill requires. The split at 0 is where the DNN separates: for eMu/res2b at
# MX=700 it leaves 97% of the signal above and 98% of the background below.
hist_bins: [ -15, 0, 15 ]

eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
  - Run3_Early
era_groups:
  Run3_Early:
    - Run3_2022
    - Run3_2022EE
    - Run3_2023
    - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
# These are the datacard bins as written: with no `binning:` block nothing slices them.
categories:
  - SR/res2b
  - SR/boosted
  - SR/recovery

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    # A sparse (channel, category, MX) signal region can have a shape
    # systematic (e.g. CMS_eff_m_id up/down) that shifts all surviving MC
    # events out of the rebinned range entirely -- a genuine all-zero shape,
    # not a negative-bin issue. Allow it; resolveType/canIgnore downstream
    # decides whether the systematic is negligible.
    allow_zero_integral: true
  - process: XtoHHto2Tau2B_${MX}
    hist_name: XtoHHto2Tau2B_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    # X -> HH -> bb tautau also reaches this dilepton selection (tau -> l nu nu),
    # so it is signal here rather than background, scaled by the same signal
    # strength as the bbWW mode. It is a much smaller contribution and can be
    # entirely empty in a sparse (channel, category, MX) slice.
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: TT
    # Sparse tail DNN slices (e.g. the recovery/dnn3 catch-all bin) have low
    # enough MC statistics that a shape systematic's up/down variation can
    # dip a bin negative within error -- same statistical-noise pattern as
    # DY/VV below, not specific to any one background.
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: DY
    channels:
      - eE
      - muMu
    # DY's aMC@NLO negative-weight events can push a single era's shape
    # negative within error in any category, not just sparse ones like
    # boosted -- seen in res2b too for standalone single-era datacards.
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: VV
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true
  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  # - W
  # - Other
uncertainties:
  # Split per year rather than per era: the luminosity calibration is a per-year
  # measurement, so 2022 and 2022EE share a nuisance and 2023 and 2023BPix share
  # another. This is lnN, so it needs nothing from the producer -- the meta-era lnN
  # path already evaluates `eras:` against the sub-eras.
  #
  # NOTE: both magnitudes are still the old flat 1.4%. Only the correlation model has
  # been fixed here; the per-year values need to be taken from the current LUM
  # recommendation (which also splits a correlated from an uncorrelated component,
  # not implemented here).
  - name: lumi_13p6TeV_2022
    type: lnN
    eras:
      - Run3_2022
      - Run3_2022EE
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3
  - name: lumi_13p6TeV_2023
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.014 # TODO: per-year LUM value


  # - name: MuonID_TightID
  - name: CMS_eff_m_id
    type: shape
  # - name: MuonID_TightIDIso
  - name: CMS_eff_m_id_iso
    type: shape
  - name: EleID_TightIDIso
    type: shape

  - name: SingleEleTrg
    type: shape
  - name: SingleMuonTrg
    type: shape


  # Decorrelated per era: the pileup profile and the minimum-bias cross section
  # are derived per era. The era suffix is produced by config/Run3_<era>/weights.yaml
  # -- the nuisance name is also the histogram name, so it cannot be added here.
  - name: CMS_pileup_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_pileup_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_pileup_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_pileup_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # BTV shape calibration, registered in config/Run3_*/weights.yaml. Correlated
  # across the four Run 3 eras -- the BTV per-era split of the *stats* sources needs
  # meta-era support that dc_make does not have yet (see docs/stat_inference.md).
  # In boosted categories the variation is neutralised at weight level, so these are
  # dropped there automatically by the canIgnore threshold.
  - name: CMS_btag_LF
    type: shape
  - name: CMS_btag_HF
    type: shape
  - name: CMS_btag_lfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_lfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_cferr1
    type: shape
  - name: CMS_btag_cferr2
    type: shape

  # AK8 calibration, registered in config/Run3_*/weights.yaml. Neutralised at
  # weight level for resolved events, so canIgnore drops these outside boosted.
  - name: CMS_bbww_ak8_Hbb
    type: shape
  - name: CMS_bbww_ak8_Hcc
    type: shape
  - name: CMS_bbww_ak8_tau21
    type: shape

  - name: CMS_scale_j
    type: shape
  # JER is measured per era, so it is decorrelated. JES (CMS_scale_j above) stays
  # correlated for now: it is still the single `Total` source, and splitting the
  # correlation sensibly requires the 11 regrouped JME sources first, which have
  # their own per-source correlation rules.
  - name: CMS_res_j_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_res_j_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_res_j_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_res_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_scale_e
    type: shape
  # Muon momentum scale/resolution. Registered in config/Run3_<era>/weights.yaml as
  # ScaRe; the correction was already applied at AnaTuple stage for these eras but no
  # variation was ever produced, so the analysis had an electron energy scale nuisance
  # and no muon counterpart. Left correlated across eras alongside CMS_scale_e.
  - name: CMS_ScaRe_mu
    type: shape


  # For multiple values, Konstantin says do [ down, up ]
  - name: QCD_scale_TT
    type: lnN
    processes:
      - TT
    value: [ -0.036, 0.025 ] # TT XS uncertainty in percentage from xsec yaml
    # TT:
    # crossSec: '923.6'
    # reference: https://twiki.cern.ch/twiki/bin/view/LHCPhysics/TtbarNNLO#Updated_reference_cross_sections
    # unc: +22.6 -33.4 (scale) +/-  22.8 (PDF alphas) -24.6 +25.4 (mass) (to be multiplied by the BR)

  - name: QCD_scale_DY
    type: lnN
    processes:
      - DY
    value: [ -0.011, 0.007 ] # DY XS uncertainty in percentage from xsec yaml
    # DY_NNLO_QCD+NLO_EW:
    # crossSec: 2094.2 * 3
    # reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/MATRIXCrossSectionsat13p6TeV
    # unc: +0.7% - 1.1%, +- 1.0% PDF alphas

  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  - name: QCD_scale_VV
    type: lnN
    processes:
      - VV
    # WARNING: this is not a QCD scale uncertainty. XSDB's `unc` field is an absolute
    # uncertainty in pb on its own Monte-Carlo integration, and 0.005 is just that
    # number divided by the cross section (WW 0.3733/80.23 = 0.47%, WZ 0.1318/29.1 =
    # 0.45%, ZZ 0.0649/12.75 = 0.51%; FLAF/config/crossSections13p6TeV.yaml:1051-1209).
    # The real NNLO diboson scale uncertainty is several percent. Needs replacing with a
    # number from the diboson theory reference; left as-is rather than guessed.
    value: 0.005

  - name: PDF_alphas
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.025
        type: lnN
        processes:
          - TT
      - value: 0.01
        type: lnN
        processes:
          - DY
      - value: 0.027
        type: lnN
        processes:
          - ST

  - name: top_mass
    hasMultipleValues: True
    type: lnN
    value:
      - value: [ -0.027, 0.028 ]
        type: lnN
        processes:
          - TT
      - value: [ -0.015, 0.015 ] # Taken from tW for now (largest unc percentage)
        type: lnN
        processes:
          - ST

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

# Overlay limit plots built by PlotResonantLimitsTask, one dhi
# PlotMultipleResonantLimits per entry, for each top-level era in `eras` above.
#
# Each `datacards` glob is relative to that era's datacard directory
# (data/<version>/Datacards[/<binning tag>]/<era>) and may use ${ERA}. The layout it
# addresses is the one DatacardMaker.writeDatacards produces: the era-combined cards sit
# at the top, per-channel cards under <era>/<channel>/, and per-base-category cards under
# <era>/categories/<CAT>/.
#
# `name` values must not contain braces -- law brace-expands datacard_names, so "fb^{-1}"
# would arrive as "fb^-1". Put that information in the campaign label instead.
# `plot_params` keys are passed straight through to PlotMultipleResonantLimits.

# dhi campaign key per era, supplying the luminosity/energy label. Every era listed in
# `eras` above that is plotted needs one: it cannot be derived from the era name, and dhi
# draws an unknown key verbatim rather than failing. Keys come from
# dhi.config.campaign_labels; the sub-era entries there are named by year, not by the
# FLAF period name.
campaigns:
  Run3_Early: run3_early
  Run3_2022: "2022preEE"
  Run3_2022EE: "2022postEE"
  Run3_2023: "2023preBPix"
  Run3_2023BPix: "2023postBPix"

limit_plots:
  - name: run3_vs_run2
    datacards:
      - { name: "Early Run 3", glob: "*.txt" }
    # Statistical extrapolation of the curve above, recomputed from the limits produced
    # by this very run -- it is a function of the measured result, so it must never be a
    # stored file that survives a rebinning. lumi_now defaults to the campaign's own
    # luminosity (dhi.config.campaign_lumis), so it cannot disagree with the label drawn
    # beside it. Optimistic: the scaling assumes the systematics shrink with the data.
    lumi_projections:
      - name: "Early Run 3 scaled to 138 fb^{-1}"
        lumi_target: 138
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    # campaign is filled per era from the `campaigns` map above, so it is deliberately
    # absent here -- putting it in this shared anchor would stamp one era's luminosity
    # on every era's plot.
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1000
      y_min: 0.001
      y_max: 100

  - name: channels
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "ee", glob: "${ERA}/eE/*.txt" }
      - { name: "e#mu", glob: "${ERA}/eMu/*.txt" }
      - { name: "#mu#mu", glob: "${ERA}/muMu/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

  - name: categories
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "res 2b", glob: "${ERA}/categories/SR_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/SR_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/SR_boosted/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style
