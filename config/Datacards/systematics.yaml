# Systematic uncertainties shared by the HH->bbWW datacard cards: those not tied to a channel's
# processes or categories -- luminosity, lepton ID/isolation/trigger, pileup, b-tagging, AK8
# tagging, jet and electron scale and resolution, parton shower -- which apply to every process
# in every channel and category. Every card includes this file next to its channel's common file
# (the CI cards too, next to CI/CI_common.yaml):
#
#   include:
#     - ../systematics.yaml
#     - dl_common.yaml    # or sl_common.yaml
#
# The merge is strict (StatInference/common/card_config.py): an uncertainty is defined in one file
# only, and defining it again in a card or a channel's common file is an error, never an
# override. So an uncertainty that differs between DL and SL (process-specific theory, the DL DY
# templates and control-region normalisations, ...) lives in that channel's common file or card,
# not here.
uncertainties:
  # Luminosity, as the Run 3 recommendation splits it: one component correlated across
  # all four eras but with a different size in each year group, and a second carried by
  # 2023 alone. Not a per-year uncorrelated pair -- that would treat the two year groups
  # as independent, which they are not.
  #
  # lumi_1 is one nuisance whose value depends on the era. Under a meta-era the datacard
  # maker cannot express that as a single lnN on the summed yield, so it builds the
  # variation sub-era by sub-era and writes it as a shape; each sub-era contributes its
  # own factor, and the ratio to nominal comes out as the yield-weighted blend.
  #
  # Reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/LumiRecommendationsRun3?extralog=-%20caching%20topic#Correlations_between_years_and_c
  - name: lumi_1_13p6TeV
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.0138
        type: lnN
        eras:
          - Run3_2022
          - Run3_2022EE
      - value: 0.0017
        type: lnN
        eras:
          - Run3_2023
          - Run3_2023BPix
  - name: lumi_2_13p6TeV
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.0127

