# The CI datacard cards' shared part: included by CI_card_DL.yaml and CI_card_SL.yaml, which
# config/ci_custom.yaml lists as the cards CI_DL and CI_SL (StatInference `cards:`), next to the
# analysis's own ../systematics/ files -- so the CI fits every uncertainty the analysis cards share
# and exercises the include merge they use (StatInference/common/card_config.py): a setting or a
# named entry is defined in one file only, anything set twice is an error.
analysis: hh_bbww
type: resonant
signalFractionForRelevantBins: 0.2
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix


autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
