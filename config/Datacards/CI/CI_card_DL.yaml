# The CI double-lepton card (CI_DL in ci_custom.yaml): the 1D DNN score in the CI sub-region,
# as the DL cards read theirs (HMESub).
include:
  # uncertainties shared by all cards (every file of ../systematics/)
  - ../systematics/luminosity.yaml
  - ../systematics/leptons.yaml
  - ../systematics/jets.yaml
  - ../systematics/parton_shower.yaml
  - CI_common.yaml
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_M${MX}_Signal/DNN_M${MX}_Signal.root
channels:
  - muMu
  - eMu
  - eE
# One bin per channel and category: at --test statistics anything finer is empty or negative.
categories:
  - OS_Iso/res2b
  - OS_Iso/recovery
# CISub: OS_Iso over the whole HME range (config/sub_regions/ci_full_hme.yaml), from the CI flavour.
input_categories:
  OS_Iso/res2b: OS_Iso_CISub_m${MX}/res2b
  OS_Iso/recovery: OS_Iso_CISub_m${MX}/recovery
hist_bins: [ -15.0, 15.0 ]
processes:
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion_bbWW_2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion_bbWW_2L_${MX}
    param_values: [ 300 ]
    is_signal: true
  # the 1L CI signal, as the DL cards hold the 1L signal; mostly empty at --test statistics
  - process: XtoHHto2B2W_1L_${MX}
    hist_name: XtoHHto2B2W_1L_${MX}
    param_values: [ 300 ]
    is_signal: true
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  # TT only: the amc@NLO DY sample's negative weights do not cancel at --test 1000, so its
  # histogram can come out negative.
  - custom_CI_Background_TT
