# The CI double-lepton card (CI_DL in ci_custom.yaml), with the preprocess step.
include:
  # uncertainties shared by all cards (every file of ../systematics/)
  - ../systematics/luminosity.yaml
  - ../systematics/leptons.yaml
  - ../systematics/jets.yaml
  - ../systematics/parton_shower.yaml
  - CI_common.yaml
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_m${MX}_vs_HME/DNN_m${MX}_vs_HME.root
channels:
  - muMu
  - eMu
  - eE
# One bin per channel and base category (CI_binning_2d.yaml's single window).
categories:
  - OS_Iso/res2b_hmebox0
  - OS_Iso/recovery_hmebox0

# must match CI_binning_2d.yaml's category_pattern
category_pattern: "{base_category}_hmebox{slice_idx}"

# The production chain (rebin_2d.py on the 2D plane), with a one-bin binning: at --test
# statistics anything finer is empty or negative.
preprocess:
  script: StatInference/bin_opt_2d/rebin_2d.py
  args:
    - --binning-config
    - config/Datacards/CI/CI_binning_2d.yaml
processes:
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion_bbWW_2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion_bbWW_2L_${MX}
    param_values: [ 300 ]
    is_signal: true
  # the 1L CI signal, as the DL cards hold the 1L signal; mostly empty at --test statistics
  - process: XtoHHto2B2W_1L_${MX}
    hist_name: XtoHHto2B2W_1L_${MX}
    param_values: [ 300 ]
    is_signal: true
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  # TT only: the amc@NLO DY sample's negative weights do not cancel at --test 1000, so its
  # histogram can come out negative.
  - custom_CI_Background_TT
