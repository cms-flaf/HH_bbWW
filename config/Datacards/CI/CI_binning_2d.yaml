# Binning for the CI card CI_DL (rebin_2d.py): the production strategy with one bin per channel and
# category, since --test statistics leave anything finer empty. Unlisted keys take rebin_2d.py's defaults.

strategy: window
window_axis: y
n_slices: 1
max_bins_per_slice: 1

# every gate off: the production floors would reject every category at --test statistics
min_slice_bkg_sum: 0.0
min_slice_bkg_neff: 0.0
min_slice_bkg_each: 0.0
min_slice_bkg_each_neff: 0.0
min_bin_bkg_each: 0.0
min_bin_bkg_neff: 0.0
bkg_per_bin: 0.0
min_bkg_frac: 0.0
min_signal: 0.0

# must match CI_card_DL.yaml's category_pattern
category_pattern: "{base_category}_hmebox{slice_idx}"
slice_var: HME
