analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_M${MX}_Signal/DNN_M${MX}_Signal.root
signalFractionForRelevantBins: 0.2
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
categories:
  - OS_Iso/res2b
  - OS_Iso/recovery

# Reads the 1D per-mass DNN score (DNN_M300_Signal), not the 2D DNN-vs-HME plane the
# production configuration uses. The datacard chain consumes 1D shapes; turning the 2D
# ones into 1D is a standalone pre-step (StatInference/bin_opt_2d/rebin_2d.py) that the
# chain does not run, and at --test statistics (--nEvents 1000, so every yield is ~1e-3
# of nominal) its production gates would drop every category before a single shape was
# written. So the CI covers the datacard and limit steps, and not the binning.
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    param_values: [ 300 ]
    is_signal: true
  # Only the t#bar{t} background. custom_CI_Background_DY is produced, merged, histogrammed
  # and plotted by the integration test, but it is not valid input for a limit here: it is an
  # amc@NLO sample, so it carries negative event weights, and `--test 1000` leaves too few
  # events for them to cancel — the single-bin histogram came out -1669 +/- 2817, compatible
  # with zero at 0.6 sigma but negative, which makes the datacard job flaky by construction.
  - custom_CI_Background_TT
uncertainties:
  - name: lumi_13p6TeV
    type: lnN
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3


  - name: CMS_eff_m_id
    type: shape
  - name: CMS_eff_m_id_iso
    type: shape
  - name: EleID_TightIDIso
    type: shape

  - name: SingleEleTrg
    type: shape
  - name: SingleMuonTrg
    type: shape

  - name: CMS_pileup
    type: shape

  - name: CMS_scale_j
    type: shape
  - name: CMS_res_j
    type: shape
  - name: CMS_scale_e
    type: shape


autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1
