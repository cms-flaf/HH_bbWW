analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_m${MX}_vs_HME/DNN_m${MX}_vs_HME.root
signalFractionForRelevantBins: 0.2
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
categories:
  - OS_Iso/res2b
  - OS_Iso/recovery

# The CI runs with --test, i.e. --nEvents 1000 per dataset, so every yield is ~1e-3 of
# nominal. The production gates (min_signal 0.5, min_slice_bkg_sum 1.0, the N_eff floors)
# would drop every category before a single shape was written, so they are all off here
# and the rebinning collapses to one DNN slice with one mass bin -- enough to exercise
# the chain end to end without asking a thousand events to support a real binning.
binning:
  n_slices: 1
  max_bins_per_slice: 1
  min_slice_bkg_sum: 0.0
  min_bin_bkg_each: 0.0
  min_signal: 0.0
  min_slice_bkg_neff: 0.0
  min_bkg_frac: 0.0
  min_bin_bkg_neff: 0.0
  bkg_per_bin: 0.0
  significance_mode: asimov
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    param_values: [ 300 ]
    is_signal: true
  # Only the t#bar{t} background. custom_CI_Background_DY is produced, merged, histogrammed
  # and plotted by the integration test, but it is not valid input for a limit here: it is an
  # amc@NLO sample, so it carries negative event weights, and `--test 1000` leaves too few
  # events for them to cancel — the single-bin histogram came out -1669 +/- 2817, compatible
  # with zero at 0.6 sigma but negative, which makes the datacard job flaky by construction.
  - custom_CI_Background_TT
uncertainties:
  - name: lumi_13p6TeV
    type: lnN
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3


  - name: CMS_eff_m_id
    type: shape
  - name: CMS_eff_m_id_iso
    type: shape
  - name: EleID_TightIDIso
    type: shape

  - name: SingleEleTrg
    type: shape
  - name: SingleMuonTrg
    type: shape

  - name: CMS_pileup
    type: shape

  - name: CMS_scale_j
    type: shape
  - name: CMS_res_j
    type: shape
  - name: CMS_scale_e
    type: shape


autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1
