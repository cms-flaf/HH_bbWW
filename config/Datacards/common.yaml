# HH->bbWW datacards: the settings every card shares (DL/dl_spin*.yaml and SL/sl_spin*.yaml
# include it), so the DL and SL cards are built, combined and fitted the same way. Not a card on
# its own. The merge is strict (StatInference/common/card_config.py): a setting written here
# cannot be set again in a card or another include, so one that differs between the channels
# goes in the channel's <channel>_common.yaml instead.
analysis: hh_bbww
type: resonant
signalFractionForRelevantBins: 0.2
# Every listed era gets its own binning, datacards and limit; only the four-era combination is
# built. Run3_22_23 is global.yaml's meta-era (its plot style is used by the shape plots).
eras:
  # - Run3_2022
  # - Run3_2022EE
  # - Run3_2023
  # - Run3_2023BPix
  - Run3_22_23
era_groups:
  Run3_22_23:
    - Run3_2022
    - Run3_2022EE
    - Run3_2023
    - Run3_2023BPix

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

campaigns:
  # dhi's key for the four eras combined (its luminosity label)
  Run3_22_23: run3_early
  Run3_2022: "2022preEE"
  Run3_2022EE: "2022postEE"
  Run3_2023: "2023preBPix"
  Run3_2023BPix: "2023postBPix"

# Pulls and impacts on the combined card (no `glob:`); see docs/stat_inference.md.
impact_plots:
  - name: combined
    masses: [ 300, 600, 800 ]
    # the expected limit at each mass (r=1 is far from it); changing it does not move the outputs,
    # see docs/stat_inference.md
    poi_value: limit
    # Simplex fallback: Migrad fails on a few fits from a bad seed, and dhi then drops the merge
    fit_args:
      - --cminFallbackAlgo Minuit2,Simplex,0:0.1
      # tighter than combine's default (tolerance 0.1): a nuisance moving r by less than the default precision (e.g.
      # the TT-CR MC-stat bins, ~0.4% of r) otherwise loses its +-1 sigma crossings and comes back as a failed fit,
      # and the other impacts carry a few % of numerical noise. ~1.5-2x the fit time.
      - --cminDefaultMinimizerStrategy 1 --cminDefaultMinimizerTolerance 0.01 --setRobustFitTolerance 0.01
    plot_params:
      # one fit per nuisance: `robust` (one Hessian) silently drops parameters it cannot invert
      method: default
      order_by_impact: true
      # a nuisance with no effect on r (e.g. CMS_eff_m_id_2022, +-0.03%, at MX 600) leaves its +-1 sigma
      # fits at r_nominal, which dhi counts as a failed fit and refuses to merge; keep the rest. The
      # task still warns, by name, about every card nuisance missing from the plot.
      keep_failures: true
      # the bin-by-bin MC-statistics nuisances (autoMCStats) too: ~300 parameters per SL point (294 at MX 600,
      # with the Fakes), ~400 per DL point. AN layout (frozen 2026-11-19, as the DL and SL impact
      # figures of the AN): 50 per page,
      # canvas 1580 px, label margin 590 px, row height 30 px, label size 22, the MC-stat names shortened
      # for display (impact_labels.py; the longest remaining label, 44 characters, fits). The AN figures
      # are also cropped to the drawn area, which dhi cannot do (a step after the plot).
      mc_stats: true
      parameters_per_page: 50
      pad_width: 1580
      left_margin: 590
      entry_height: 30
      label_size: 22
      labels: config/Datacards/impact_labels.py

# The processes DL and SL define alike; each card adds its own (DL: DY, Minor; SL: W, DY, Minor).
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true

  # Made by the preprocess step as sums of merged-histogram processes, `preprocess: members` (a
  # member lacking a variation enters at its nominal). ttV alone has too few, too heavy events to
  # pass the gates. The binning already keeps the backgrounds free of negative bins; the
  # tolerances are a safety net.
  - process: TT
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    preprocess:
      members: [ TT, ttV ]

  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
