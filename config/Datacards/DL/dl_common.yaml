# HH->bbWW DL resonant datacards: everything the spin-0 and spin-2 cards share.
#
# Not a card on its own. The cards dl_spin0.yaml and dl_spin2.yaml include it, together with
# the uncertainties shared with the SL cards (../systematics.yaml), and add what differs
# between the spins: the signal processes, their branching-ratio uncertainties and the limit
# plots. Merging is strict (StatInference/common/card_config.py):
# a top-level key is set in one file only, and an entry of `processes`, `uncertainties`,
# `limit_plots` or `impact_plots` is defined once -- anything set twice is an error, never
# an override. So a setting that differs between the spins goes in both spin cards and
# not here.
# ${MX} and ${ERA} are filled by StatInference.
analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_M${MX}_Signal/DNN_M${MX}_Signal.root
signalFractionForRelevantBins: 0.2
# Every era listed here gets its own binning, its own datacards and its own limit.
#
# The four sub-eras are off for now. None of them builds standalone: on a single era's
# statistics a handful of DY shapes go negative beyond tolerance in the sparsest DNN
# slices, and resolveNegativeBins rejects them. Measured over 4 mass points, of ~500
# background shapes each -- 2022: 5 rejected, 2022EE: 5, 2023: 2, 2023BPix: 6, and
# their combination: 0. It does not track luminosity; it tracks where DY's negative-weight
# events land. Turning them back on wants either min_slice_bkg_each_neff on in
# config/Datacards/DL/binning_2d.yaml, so those slices are never cut, or a looser
# max_n_sigma_for_negative_bins for DY. (Measured with binning_2d.yaml.)
#
# They stay in era_groups below regardless: Run3_22_23 is the combination of all four
# datasets, which is a statement about the data, not about which limits we set. The name
# is the meta-era's of global.yaml's era_groups, whose plot style (config/plot/Run3_22_23.yaml)
# the shape plots of the datacard step use.
eras:
  # - Run3_2022
  # - Run3_2022EE
  # - Run3_2023
  # - Run3_2023BPix
  - Run3_22_23
era_groups:
  Run3_22_23:
    - Run3_2022
    - Run3_2022EE
    - Run3_2023
    - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
# One datacard category per region and jet category, all in the frozen HME window of the jet
# category: the sub-regions <region>_HMESub_m<MX> (config/sub_regions/hme_DL_v2610.yaml,
# flavour Signal_Extraction_DL_window), where the DNN score DNN_M<MX>_Signal is filled only for
# events inside the window of MX:
#   SR_* : m_ll < 70 GeV, the DNN score in equal-signal bins;
#   TT_* : TT_CR, m_ll > 110 GeV, the DNN score in 5 bins of equal background;
#   DY_* : DY_CR, |m_ll - mZ| < 10 GeV, the same (binning_eqsig_DL_v2610.yaml: control_region_bins).
# The control regions constrain the TT and DY normalisations (CMS_bbww_norm_TT/DY_*, lnN below)
# and, binned, the shape nuisances shared with the SR (each with its own DNN tilt,
# CMS_bbww_{tt,dy}cr_shape_*). The names carry no
# "/" (they become the datacard bin names, and with them the names of the per-bin MC-stat
# nuisances, which dhi's impact merging cannot handle with a "/"); input_categories maps each to
# its directory in the histogram files.
categories:
  - SR_res2b
  - SR_boosted
  - SR_recovery
  - TT_res2b
  - TT_boosted
  - TT_recovery
  - DY_res2b
  - DY_boosted
  - DY_recovery
input_categories:
  SR_res2b: SR_HMESub_m${MX}/res2b
  SR_boosted: SR_HMESub_m${MX}/boosted
  SR_recovery: SR_HMESub_m${MX}/recovery
  TT_res2b: TT_CR_HMESub_m${MX}/res2b
  TT_boosted: TT_CR_HMESub_m${MX}/boosted
  TT_recovery: TT_CR_HMESub_m${MX}/recovery
  DY_res2b: DY_CR_HMESub_m${MX}/res2b
  DY_boosted: DY_CR_HMESub_m${MX}/boosted
  DY_recovery: DY_CR_HMESub_m${MX}/recovery

# Applied to the merged histograms before the datacards are built, by
# PreprocessShapesTask. The chain knows nothing about what this does -- it supplies
# --input, --output, --era and --config, and the script writes
# "<era>/<variable>/<variable>.root". Here it merges the merged-histogram processes into the
# backgrounds below and bins the DNN score of each sub-region into bins of equal signal
# (binning_eqsig_DL_v2610.yaml); it also carries the members of the member uncertainties
# (QCD-scale points, PDF members) to the final bins, which the datacard maker reduces. Its input
# is the Run3_Model_DYSplit merged histograms of the flavour Signal_Extraction_DL_window, with
# the control regions (DY as DY_M_10to50 + DY_M_50; TT_CR and DY_CR) and the theory members,
# e.g. --hists-version v2610_theory_window_test. Remove this block and the chain reads the
# merged histograms unchanged.
# --jobs: masses binned in parallel, one process each (< 1 GB). On condor give the task as many
# CPUs: --PreprocessShapesTask-n-cpus 8.
preprocess:
  script: Analysis/EqualSignalBinning.py
  args:
    - --binning-config
    - config/Datacards/DL/binning_eqsig_DL_v2610.yaml
    - --jobs
    - "8"

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true

  # The backgrounds are made by the preprocess step from the merged-histogram processes
  # (binning_eqsig_DL_v2610.yaml: backgrounds):
  #   TT         = TT + ttV
  #   DY         = DY_M_10to50 + DY_M_50, normalised in DY_CR; low-mass DY in SR boosted
  #                estimated from SR recovery, none in the control regions; in SR eE/muMu
  #                resolved and SR boosted a smooth template replaces the DY MC (dy_template)
  #   ST
  #   Minor      = VV + VVV + H + W (W in recovery only)
  # The binning only closes a bin once each of them passes its gates, for the nominal and every
  # variation, so none of them has negative or single-event bins; the tolerances below are
  # kept as a safety net.
  - process: TT
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  # All three channels. In eMu DY is mostly DY->tautau and is not small where the signal
  # is: v2610, Run3_2022+2023+2023BPix, it is 16-56% of the background in the bins
  # holding the best half of the signal at MX = 800-1200 (eMu recovery at 1200: 56%).
  - process: DY
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: Minor
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true

uncertainties:
  # The uncertainties shared with the SL cards (luminosity, pileup, lepton, b-tagging, AK8,
  # jet and electron, parton shower) are in ../systematics.yaml, which the DL cards include
  # next to this file; the ones below are DL-specific.

  # DY reweighting (hh2bbtautau derivation). Scoped to DY: the correction is
  # configured with a processes: list, so it is a no-op everywhere else.
  # The per-era fit's statistical uncertainty is decorrelated by era; the two
  # fit-model variations are correlated.
  - name: CMS_bbww_dy_stat_btag0_2022
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022
  - name: CMS_bbww_dy_stat_btag0_2022EE
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022EE
  - name: CMS_bbww_dy_stat_btag0_2023
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023
  - name: CMS_bbww_dy_stat_btag0_2023BPix
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_dy_stat_btag1_2022
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022
  - name: CMS_bbww_dy_stat_btag1_2022EE
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022EE
  - name: CMS_bbww_dy_stat_btag1_2023
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023
  - name: CMS_bbww_dy_stat_btag1_2023BPix
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_dy_stat_btag2_2022
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022
  - name: CMS_bbww_dy_stat_btag2_2022EE
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022EE
  - name: CMS_bbww_dy_stat_btag2_2023
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023
  - name: CMS_bbww_dy_stat_btag2_2023BPix
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_dy_syst_gauss
    type: shape
    processes:
      - DY
  - name: CMS_bbww_dy_syst_linear
    type: shape
    processes:
      - DY


  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  # Theory and normalisation uncertainties of the members of merged backgrounds (TT = TT + ttV,
  # DY = DY_M_10to50 + DY_M_50, Minor = VV + VVV + H + W, and PDF_alphas across TT, ST, DY and
  # Minor). The preprocess step writes each as a shape of the merged background that moves only
  # that member's own part, by the member's own amount; the values and their sources are in
  # binning_eqsig_DL_v2610.yaml (member_uncertainties).
  - name: QCD_scale_TT
    type: shape
    processes: [ TT ]
  # DY_M_50 only: low-mass DY has its own prior (CMS_bbww_norm_DY_lowmass)
  - name: QCD_scale_DY
    type: shape
    processes: [ DY ]
  - name: QCD_scale_ttV
    type: shape
    processes: [ TT ]
  - name: top_mass
    type: shape
    processes: [ TT, ST ]
  - name: PDF_alphas
    type: shape
    processes: [ TT, ST, DY, Minor ]
  - name: CMS_bbww_minor_norm_VV
    type: shape
    processes: [ Minor ]
  - name: CMS_bbww_minor_norm_VVV
    type: shape
    processes: [ Minor ]
  - name: CMS_bbww_minor_norm_H
    type: shape
    processes: [ Minor ]
  # W is only in recovery (binning_eqsig_DL_v2610.yaml: drop), in every region
  - name: CMS_bbww_minor_norm_W
    type: shape
    processes: [ Minor ]
    categories: [ SR_recovery, TT_recovery, DY_recovery ]

  # The DY templates (binning_eqsig_DL_v2610.yaml: dy_template) replace the DY MC statistics in
  # the same-flavour resolved categories and in boosted; each window's fit uncertainty is its own
  # nuisance. Boosted eE and muMu share one fitted shape, but each channel's normalisation is its
  # own DY MC yield, with its own statistical error: one nuisance per channel.
  - name: CMS_bbww_dy_fit_eE_res2b
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_res2b ]
  - name: CMS_bbww_dy_fit_muMu_res2b
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_res2b ]
  - name: CMS_bbww_dy_fit_eE_recovery
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_recovery ]
  - name: CMS_bbww_dy_fit_muMu_recovery
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_recovery ]
  - name: CMS_bbww_dy_fit_eE_boosted
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_boosted ]
  - name: CMS_bbww_dy_fit_muMu_boosted
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_boosted ]
  - name: CMS_bbww_dy_fit_eMu_boosted
    type: shape
    processes: [ DY ]
    channels: [ eMu ]
    categories: [ SR_boosted ]

  # Low-mass DY in SR boosted is estimated from SR recovery into DY (binning_eqsig_DL_v2610.yaml:
  # lowmass_dy); +-100% on that estimate.
  - name: CMS_bbww_dy_lowmass
    type: shape
    processes: [ DY ]
    categories: [ SR_boosted ]

  # Low-mass DY (10 < m_ll < 50 GeV) is in no control region: both lie above 70 GeV. It is part of
  # DY, so it shares the normalisation DY_CR fixes, and has a prior of its own on top, a shape of DY
  # that moves only its low-mass part (binning_eqsig_DL_v2610.yaml: member_uncertainties). In SR
  # boosted it is the estimate instead (CMS_bbww_dy_lowmass); there is none in the control regions.
  - name: CMS_bbww_norm_DY_lowmass
    type: shape
    processes: [ DY ]
    categories: [ SR_res2b, SR_recovery ]

  # Normalisations of TT (incl. ttV) and DY (m_ll > 50 GeV): constrained priors, not free
  # parameters. Each applies to the signal region and both control regions of its jet category,
  # every channel and every era, so the control regions (TT_CR / DY_CR) constrain it in the fit.
  # Boosted has ~100 events per era in either control region, so it shares the res2b one. The
  # priors are generous (the cross-section uncertainties plus the modelling of our phase space);
  # v2610 loose, Asimov: the control regions constrain them to TT +-4-5%, DY +-3-7%, and the
  # expected limits equal those with free rateParams (<= 0.2%, MX 300-1300), also with priors
  # half or twice as wide.
  - name: CMS_bbww_norm_TT_res2b
    type: lnN
    processes: [ TT ]
    categories: [ SR_res2b, TT_res2b, DY_res2b, SR_boosted, TT_boosted, DY_boosted ]
    value: 0.10
  - name: CMS_bbww_norm_TT_recovery
    type: lnN
    processes: [ TT ]
    categories: [ SR_recovery, TT_recovery, DY_recovery ]
    value: 0.10
  - name: CMS_bbww_norm_DY_res2b
    type: lnN
    processes: [ DY ]
    categories: [ SR_res2b, TT_res2b, DY_res2b, SR_boosted, TT_boosted, DY_boosted ]
    value: 0.20
  - name: CMS_bbww_norm_DY_recovery
    type: lnN
    processes: [ DY ]
    categories: [ SR_recovery, TT_recovery, DY_recovery ]
    value: 0.20

  # DNN-shape uncertainties of the binned control regions (binning_eqsig_DL_v2610.yaml:
  # control_region_shapes): a tilt of the region's main process along the DNN score, +-4% (DY in
  # DY_CR) and +-2% (TT in TT_CR) at the ends, the observed data / MC slope at 1 sigma; one per jet
  # category, every channel and era. They absorb the control regions' shape mis-modelling, so it
  # does not pull the shape nuisances shared with the SR.
  - name: CMS_bbww_dycr_shape_res2b
    type: shape
    processes: [ DY ]
    categories: [ DY_res2b ]
  - name: CMS_bbww_ttcr_shape_res2b
    type: shape
    processes: [ TT ]
    categories: [ TT_res2b ]
  - name: CMS_bbww_dycr_shape_recovery
    type: shape
    processes: [ DY ]
    categories: [ DY_recovery ]
  - name: CMS_bbww_ttcr_shape_recovery
    type: shape
    processes: [ TT ]
    categories: [ TT_recovery ]
  - name: CMS_bbww_dycr_shape_boosted
    type: shape
    processes: [ DY ]
    categories: [ DY_boosted ]
  - name: CMS_bbww_ttcr_shape_boosted
    type: shape
    processes: [ TT ]
    categories: [ TT_boosted ]

  # QCD scale and PDF shapes, one nuisance each per merged-histogram process (the physics
  # model's processes, not the card's backgrounds): the merged histograms keep every member
  # (<process>_QCDscale_shape_<process>_<muR..._muF...>, <process>_pdf_shape_<process>_<k>),
  # the preprocess step carries them to the final bins inside the card background holding that
  # process, and the datacard maker reduces them on the summed eras (StatInference
  # dc_make/member_reduction.py). The weights are normalised to the nominal sum of weights of
  # each sample, so these are shape and acceptance effects; the cross-section uncertainties are
  # the lnN / member terms above. QCD scale: 7-point envelope (the 6 points without the
  # opposite muR, muF variations). PDF: the Hessian sum of members 1-100 around the nominal
  # (member 0 equals it), plus alpha_s from 101/102 where the sample has them -- ST and VVV do
  # not (4-flavour t-channel / no alpha_s weights; theirs are NaN).
  - name: QCDscale_shape_TT
    type: shape
    processes: [ TT ]
    members: &qcd_scale_7point
      reduction: envelope
      names: [ muR0p5_muF0p5, muR0p5_muF1, muR1_muF0p5, muR1_muF2, muR2_muF1, muR2_muF2 ]
  - name: pdf_shape_TT
    type: shape
    processes: [ TT ]
    members: &pdf_hessian_alphas
      reduction: hessian
      names: { first: 1, last: 100 }
      alpha_s: [ 101, 102 ]
  - name: QCDscale_shape_ttV
    type: shape
    processes: [ TT ]
    members: *qcd_scale_7point
  - name: pdf_shape_ttV
    type: shape
    processes: [ TT ]
    members: *pdf_hessian_alphas
  - name: QCDscale_shape_DY_M_50
    type: shape
    processes: [ DY ]
    members: *qcd_scale_7point
  - name: pdf_shape_DY_M_50
    type: shape
    processes: [ DY ]
    members: *pdf_hessian_alphas
  - name: QCDscale_shape_DY_M_10to50
    type: shape
    processes: [ DY ]
    members: *qcd_scale_7point
  - name: pdf_shape_DY_M_10to50
    type: shape
    processes: [ DY ]
    members: *pdf_hessian_alphas
  - name: QCDscale_shape_ST
    type: shape
    processes: [ ST ]
    members: *qcd_scale_7point
  - name: pdf_shape_ST
    type: shape
    processes: [ ST ]
    members: &pdf_hessian
      reduction: hessian
      names: { first: 1, last: 100 }
  - name: QCDscale_shape_VV
    type: shape
    processes: [ Minor ]
    members: *qcd_scale_7point
  - name: pdf_shape_VV
    type: shape
    processes: [ Minor ]
    members: *pdf_hessian_alphas
  - name: QCDscale_shape_VVV
    type: shape
    processes: [ Minor ]
    members: *qcd_scale_7point
  - name: pdf_shape_VVV
    type: shape
    processes: [ Minor ]
    members: *pdf_hessian
  - name: QCDscale_shape_H
    type: shape
    processes: [ Minor ]
    members: *qcd_scale_7point
  - name: pdf_shape_H
    type: shape
    processes: [ Minor ]
    members: *pdf_hessian_alphas
  - name: QCDscale_shape_W
    type: shape
    processes: [ Minor ]
    members: *qcd_scale_7point
  - name: pdf_shape_W
    type: shape
    processes: [ Minor ]
    members: *pdf_hessian_alphas

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

campaigns:
  # dhi's key for the four eras combined (its luminosity label)
  Run3_22_23: run3_early
  Run3_2022: "2022preEE"
  Run3_2022EE: "2022postEE"
  Run3_2023: "2023preBPix"
  Run3_2023BPix: "2023postBPix"

# Nuisance pulls and impacts, drawn by PlotPullsAndImpactsTask into
# <version>/ImpactPlots/<card>/<name>/<era>/<mass>/.
#
# This entry has no `glob:`, so it uses the combined card ResonantLimitsTask writes --
# every era and every category in one fit. To rank one category instead, give an entry a
# glob addressing its card, e.g.
#
#   - name: res2b
#     glob: "${ERA}/categories/SR_res2b/*.txt"
#
# The glob and the mass must select exactly one card: PullsAndImpacts fits a single
# workspace.
impact_plots:
  - name: combined
    masses: [ 300, 600, 800 ]
    # The Asimov dataset is built at this signal strength. It has to be near the limit to
    # mean anything: dhi's default is r=1, which at 300 (limit ~6.8) is an almost
    # invisible signal so the ranking is really the background-only one, and at 800
    # (limit ~0.065) is ten times more signal than can be excluded, which pins r and
    # collapses every impact towards zero. "limit" takes the expected limit at each mass
    # from the limits already merged for these cards; a number sets it explicitly.
    #
    # It reaches combine as --expectSignal through PullsAndImpacts' custom_args. It cannot
    # go through dhi's `parameter_values`: for a resonant search hh_model is NO_STR, and
    # POITask then hard-codes the joined parameter values to '""' and the output postfix
    # to r=1.0, so the value would be dropped without a word.
    #
    # WARNING: the fit's output path does not depend on it -- custom_args is significant
    # for task identity but not for the store path -- so changing this value does not move
    # the outputs. Clear <version>/PullsAndImpacts, MergePullsAndImpacts and
    # PlotPullsAndImpacts under inference/data/store before re-running with a different
    # one, or law will report the old fit as complete.
    poi_value: limit
    # Migrad fails on a few of these fits from a bad seed gradient -- at 300 it was
    # CMS_eff_m_id_iso_2023 -- and dhi aborts the whole merge rather than the branch, so
    # 80 converged fits produce nothing. MINIMIZER_no_analytic, which dhi suggests, tends
    # to move the failure to another parameter; falling back to Simplex converges it.
    # Anything here reaches combine through PullsAndImpacts' custom_args.
    fit_args:
      - --cminFallbackAlgo Minuit2,Simplex,0:0.1
    plot_params:
      # One combine job per nuisance per direction. `robust` would instead take a single
      # fit and invert the Hessian, which is far cheaper but drops any parameter it cannot
      # invert -- it silently lost all four CMS_scale_j_* on these cards. Per-parameter
      # fits are what a ranking should be built from.
      method: default
      order_by_impact: true
      # mc_stats would add a few hundred autoMCStats bins. If you turn it on, set
      # parameters_per_page as well (25 works) or the plot is one unreadable page -- the
      # task refuses the combination rather than drawing it.
      mc_stats: false
