# HH->bbWW DL datacards, spin-0 (radion) signal hypothesis.
# Shared with dl_spin2.yaml: everything but the signals and the limit plots; the
# signals, with their BR and theory uncertainties, are shared with the SL card of this spin.
include:
  # settings of every card (eras, fit and plot settings)
  - ../common.yaml
  # uncertainties shared by all cards (every file of ../systematics/)
  - ../systematics/luminosity.yaml
  - ../systematics/leptons.yaml
  - ../systematics/jets.yaml
  - ../systematics/parton_shower.yaml
  - ../systematics/dy_reweighting.yaml
  # DL-only uncertainties (every file of systematics/)
  - systematics/theory.yaml
  - systematics/dy_template.yaml
  - systematics/normalisations.yaml
  - systematics/cr_shapes.yaml
  - dl_common.yaml
  # the signals of this spin, with their uncertainties (shared with SL/sl_spin0.yaml)
  - ../signals/spin0.yaml

# Compared with the Run 2 DL expected limit of the same spin (run2_external_limits.json).
limit_plots:
  - name: spin0_run3_vs_run2
    bands: true
    datacards:
      - { name: "Early Run 3 spin-0 (radion)", glob: "*.txt" }
    lumi_projections:
      - name: "Early Run 3 spin-0 scaled to 138 fb^{-1}"
        lumi_target: 138
    external_limits:
      - { file: config/Datacards/run2_external_limits.json, key: "DL/spin0" }
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1600
      y_min: 0.002
      y_max: 100

  - name: spin0_channels
    datacards:
      - { name: "Combined spin-0 (radion)", glob: "*.txt" }
      - { name: "ee", glob: "${ERA}/eE/*.txt" }
      - { name: "e#mu", glob: "${ERA}/eMu/*.txt" }
      - { name: "#mu#mu", glob: "${ERA}/muMu/*.txt" }
    external_limits:
      - { file: config/Datacards/run2_external_limits.json, key: "DL/spin0" }
    plot_params: *limit_plot_style

  - name: spin0_categories
    datacards:
      - { name: "Combined spin-0 (radion)", glob: "*.txt" }
      # each jet category with its control regions (dhi combines the cards of one mass)
      - { name: "res 2b", glob: "${ERA}/categories/*_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/*_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/*_boosted/*.txt" }
    external_limits:
      - { file: config/Datacards/run2_external_limits.json, key: "DL/spin0" }
    plot_params: *limit_plot_style
