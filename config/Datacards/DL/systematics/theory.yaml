# DL process theory: QCD scale, PDF+alpha_s, top mass.
uncertainties:
  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  # Members of the merged backgrounds: each a shape of the merged process moving only its member
  # (values and sources in binning_eqsig_DL_v2610.yaml: member_uncertainties).
  - name: QCD_scale_TT
    type: shape
    processes: [ TT ]

  # DY_M_50 only: low-mass DY has its own prior (CMS_bbww_norm_DY_lowmass)
  - name: QCD_scale_DY
    type: shape
    processes: [ DY ]
  - name: QCD_scale_ttV
    type: shape
    processes: [ TT ]
  - name: top_mass
    type: shape
    processes: [ TT, ST ]
  - name: PDF_alphas
    type: shape
    processes: [ TT, ST, DY, Minor ]
