# The DY templates of the preprocess step and the low-mass DY estimate in SR boosted.
#
# DL only: included by DL/dl_spin0.yaml and DL/dl_spin2.yaml, next to ../systematics/ (shared with
# SL) and dl_common.yaml. The merge is strict (StatInference/common/card_config.py): an uncertainty
# is defined in one file only.
uncertainties:
  # The DY templates (binning_eqsig_DL_v2610.yaml: dy_template) replace the DY MC statistics in
  # the same-flavour resolved categories and in boosted; each window's fit uncertainty is its own
  # nuisance. Boosted eE and muMu share one fitted shape, but each channel's normalisation is its
  # own DY MC yield, with its own statistical error: one nuisance per channel.
  - name: CMS_bbww_dy_fit_eE_res2b
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_res2b ]
  - name: CMS_bbww_dy_fit_muMu_res2b
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_res2b ]
  - name: CMS_bbww_dy_fit_eE_recovery
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_recovery ]
  - name: CMS_bbww_dy_fit_muMu_recovery
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_recovery ]
  - name: CMS_bbww_dy_fit_eE_boosted
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_boosted ]
  - name: CMS_bbww_dy_fit_muMu_boosted
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_boosted ]
  - name: CMS_bbww_dy_fit_eMu_boosted
    type: shape
    processes: [ DY ]
    channels: [ eMu ]
    categories: [ SR_boosted ]

  # Low-mass DY in SR boosted is estimated from SR recovery into DY (binning_eqsig_DL_v2610.yaml:
  # lowmass_dy); +-100% on that estimate.
  - name: CMS_bbww_dy_lowmass
    type: shape
    processes: [ DY ]
    categories: [ SR_boosted ]
