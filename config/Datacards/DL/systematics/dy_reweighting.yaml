# The DY reweighting (hh2bbtautau derivation): fit statistics per era, fit-model variations.
#
# DL only: included by DL/dl_spin0.yaml and DL/dl_spin2.yaml, next to ../systematics/ (shared with
# SL) and dl_common.yaml. The merge is strict (StatInference/common/card_config.py): an uncertainty
# is defined in one file only.
uncertainties:
  # DY reweighting (hh2bbtautau derivation). Scoped to DY: the correction is
  # configured with a processes: list, so it is a no-op everywhere else.
  # The per-era fit's statistical uncertainty is decorrelated by era; the two
  # fit-model variations are correlated.
  - name: CMS_bbww_dy_stat_btag0_2022
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022
  - name: CMS_bbww_dy_stat_btag0_2022EE
    type: shape
    processes:
