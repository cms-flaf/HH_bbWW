# Equal-signal binning of the DL fit inputs (Analysis/EqualSignalBinning.py, the DL cards' preprocess
# step): each category is its HME sub-region <region>_HMESub_m<MX> (1D DNN_M<MX>_Signal), binned in
# the DNN score from the top into bins of equal signal; a bin closes only once the backgrounds pass
# the gates.
#
# The binning only: the targets below are a saved, good-enough choice, to be replaced freely (or
# replaced by saved edges, --edges <binning.json>). What is merged and estimated and every
# uncertainty are in the card (dl_common.yaml and the systematics files, `preprocess:` blocks),
# and are rebuilt in whatever bins this gives. See docs/stat_inference.md.

# 1D inputs need no windows. For the 2D DNN_m<MX>_vs_HME inputs (input_categories without the
# sub-regions), name the windows to cut out of them:
# windows: config/sub_regions/hme_DL_v2610.yaml

# Target bins per window (n <= 20, best TT-only expected sensitivity); the gates may merge fewer.
n_bins:
  250: { res2b: 16, recovery: 20, boosted: 1 }
  260: { res2b: 20, recovery: 20, boosted: 12 }
  270: { res2b: 20, recovery: 20, boosted: 17 }
  280: { res2b: 20, recovery: 20, boosted: 19 }
  300: { res2b: 20, recovery: 19, boosted: 14 }
  320: { res2b: 20, recovery: 20, boosted: 19 }
  350: { res2b: 20, recovery: 20, boosted: 18 }
  360: { res2b: 20, recovery: 20, boosted: 20 }
  400: { res2b: 20, recovery: 18, boosted: 20 }
  450: { res2b: 14, recovery: 20, boosted: 17 }
  500: { res2b: 19, recovery: 18, boosted: 19 }
  550: { res2b: 17, recovery: 20, boosted: 17 }
  600: { res2b: 15, recovery: 18, boosted: 14 }
  650: { res2b: 14, recovery: 19, boosted: 14 }
  700: { res2b: 20, recovery: 15, boosted: 16 }
  750: { res2b: 16, recovery: 19, boosted: 8 }
  800: { res2b: 16, recovery: 18, boosted: 12 }
  850: { res2b: 16, recovery: 20, boosted: 6 }
  900: { res2b: 16, recovery: 20, boosted: 7 }
  1000: { res2b: 15, recovery: 15, boosted: 7 }
  1100: { res2b: 13, recovery: 16, boosted: 3 }
  1200: { res2b: 16, recovery: 18, boosted: 5 }
  1300: { res2b: 17, recovery: 13, boosted: 6 }
  1400: { res2b: 8, recovery: 13, boosted: 3 }
  1500: { res2b: 10, recovery: 13, boosted: 3 }

# Per bin, summed over eras, nominal and every variation: total background >= min_bkg with
# N_eff >= min_bkg_neff; every background >= 0; a background >= exempt_fraction of its window also
# > min_bkg x exempt_fraction, N_eff >= min_each_neff, each variation N_eff >= min_variation_neff.
gates:
  min_bkg: 0.2
  min_bkg_neff: 4
  min_each_neff: 2
  min_variation_neff: 2
  exempt_fraction: 0.05

# Control regions: the window in this many equal-background DNN bins (same gates); binned, they also
# constrain the shape nuisances shared with the SR.
control_region_bins:
  TT_CR: 5
  DY_CR: 5
