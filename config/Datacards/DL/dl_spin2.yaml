# HH->bbWW DL datacards, spin-2 (graviton) signal hypothesis.
# Shared with dl_spin0.yaml: dl_common.yaml and the uncertainty files below; here only
# the signals, their BR uncertainties and the limit plots.
include:
  # uncertainties shared by all cards (every file of ../systematics/)
  - ../systematics/luminosity.yaml
  - ../systematics/leptons.yaml
  - ../systematics/jets.yaml
  - ../systematics/parton_shower.yaml
  # DL-only uncertainties (every file of systematics/)
  - systematics/theory.yaml
  - systematics/dy_reweighting.yaml
  - systematics/dy_template.yaml
  - systematics/normalisations.yaml
  - systematics/cr_shapes.yaml
  - dl_common.yaml

processes:
  - process: GluGluToBulkGraviton_bbWW_2L_${MX}
    hist_name: GluGluToBulkGraviton_bbWW_2L_${MX}
    param_values: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500 ]
    is_signal: true
    allow_zero_integral: true

  # 1L: reaches the dilepton categories only through a fake second lepton (~1-5 % of 2L)
  - process: GluGluToBulkGraviton_bbWW_1L_${MX}
    hist_name: GluGluToBulkGraviton_bbWW_1L_${MX}
    param_values: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500 ]
    is_signal: true
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: GluGluToBulkGraviton_bbTauTau_${MX}
    hist_name: GluGluToBulkGraviton_bbTauTau_${MX}
    param_values: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500 ]
    is_signal: true
    allow_zero_integral: true

uncertainties:
  # Higgs BRs (hh/naming-conventions), correlated across eras. The process patterns are regexes:
  # the signal names carry the resolved mass, so a literal name would silently match nothing.
  - name: BR_hbb
    type: lnN
    processes:
      - ^GluGluToBulkGraviton_bbWW_2L_
      - ^GluGluToBulkGraviton_bbWW_1L_
      - ^GluGluToBulkGraviton_bbTauTau_
    value: [ -0.0126, 0.0124 ]
  - name: BR_hww
    type: lnN
    processes:
      - ^GluGluToBulkGraviton_bbWW_2L_
      - ^GluGluToBulkGraviton_bbWW_1L_
    value: [ -0.0152, 0.0153 ]
  - name: BR_htt
    type: lnN
    processes:
      - ^GluGluToBulkGraviton_bbTauTau_
    value: [ -0.0163, 0.0165 ]

# Compared with the Run 2 DL expected limit of the same spin (run2_external_limits.json).
limit_plots:
  - name: spin2_run3_vs_run2
    bands: true
    datacards:
      - { name: "Early Run 3 spin-2 (graviton)", glob: "*.txt" }
    lumi_projections:
      - name: "Early Run 3 spin-2 scaled to 138 fb^{-1}"
        lumi_target: 138
    external_limits:
      - { file: config/Datacards/run2_external_limits.json, key: "DL/spin2" }
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1500
      y_min: 0.001
      y_max: 100

  - name: spin2_channels
    datacards:
      - { name: "Combined spin-2 (graviton)", glob: "*.txt" }
      - { name: "ee", glob: "${ERA}/eE/*.txt" }
      - { name: "e#mu", glob: "${ERA}/eMu/*.txt" }
      - { name: "#mu#mu", glob: "${ERA}/muMu/*.txt" }
    external_limits:
      - { file: config/Datacards/run2_external_limits.json, key: "DL/spin2" }
    plot_params: *limit_plot_style

  - name: spin2_categories
    datacards:
      - { name: "Combined spin-2 (graviton)", glob: "*.txt" }
      # each jet category with its control regions (dhi combines the cards of one mass)
      - { name: "res 2b", glob: "${ERA}/categories/*_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/*_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/*_boosted/*.txt" }
    external_limits:
      - { file: config/Datacards/run2_external_limits.json, key: "DL/spin2" }
    plot_params: *limit_plot_style
