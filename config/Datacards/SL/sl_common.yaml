# HH->bbWW SL datacards: the settings shared by sl_spin0.yaml and sl_spin2.yaml (as DL/dl_common.yaml),
# which include it with ../common.yaml (the settings of every card), the signals and the uncertainty
# files. Not a card on its own. The merge is strict: anything set in two files is an error.
#
# The signal region only (the SR window of each jet category), with the data-driven fake-lepton
# background (Fakes, Analysis/SL_fakes.py, estimated in the SR windows only): no TT / W+jets control
# region in the fit, as they have no fake estimate (user, 2026-11-20). Expected (Asimov) limits.
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  # The binary score of the two-stage SL DNN (a logit, -23.5:23.5), parametrised in the mass, 1D
  # in each HME sub-region (flavour Signal_Extraction_SL_window, Run3_Model_DYSplit: DY_M_10to50 + DY_M_50).
  input_file_pattern: ${ERA}/TwoStageDNN_M${MX}_binary/TwoStageDNN_M${MX}_binary.root
channels:
  - e
  - mu
# The SR window of each jet category: the sub-region <region>_HMESub_m<MX> of the booking plugin
# (config/sub_regions/hme_SL_v2610.yaml, the [16, 84] % signal window). No "/" in the names (bin
# and MC-stat nuisance names); input_categories maps them to the inputs.
categories:
  - SR_res2b
  - SR_boosted
  - SR_recovery
input_categories:
  SR_res2b: SR_SL_HMESub_m${MX}/res2b
  SR_boosted: SR_SL_HMESub_m${MX}/boosted
  SR_recovery: SR_SL_HMESub_m${MX}/recovery

# The DL preprocess step (see dl_common.yaml): merges the backgrounds, bins the DNN score of each
# SR window into bins of equal signal and carries the QCD-scale / PDF members to
# the final bins. The binning configuration holds the binning only; to reuse saved edges, replace
# it by --edges <a binning.json of this step>.
preprocess:
  script: Analysis/EqualSignalBinning.py
  args:
    - --binning-config
    - config/Datacards/SL/binning_eqsig_SL_v2610.yaml
    # one mass per PreprocessShapesTask branch (${MX} = the branch's mass), as for DL
    - --masses
    - ${MX}

# SR window background (4 eras, MX 300 -> 800): TT 77-91 % -> 52-80 %, W 2-11 % -> 9-35 %,
# ST 6-10 %, DY 0.4-4 %, VV + VVV + ttV + H 1-2 %. Merged as in DL where the processes are the
# same (TT with ttV; Minor), with W a background of its own (in DL it is in Minor). data_obs, TT
# and ST are in ../common.yaml (shared with DL).
processes:
  - process: W
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  # DY_M_10to50 + DY_M_50 (Run3_Model_DYSplit, as DL), so the DY theory nuisances are DL's. No separate
  # low-mass DY prior (DL's CMS_bbww_norm_DY_lowmass belongs to its DY estimate): DY is 0.4-4 % of the SL
  # SR background.
  - process: DY
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    preprocess:
      members: [ DY_M_10to50, DY_M_50 ]

  - process: Minor
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true
    preprocess:
      members: [ VV, VVV, H ]

  # The data-driven fake-lepton background (config/processes.yaml Fakes, estimated by HistMergerTask in the
  # SR windows; zero templates in a cell without an estimate) with its four nuisance families
  # (systematics/fakes.yaml). It takes no part in the binning gates: its parts can be empty (f <= 0) and
  # its Down variations zero, and the bins are those of the other backgrounds.
  - process: Fakes
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true
    preprocess:
      gates: false

# The uncertainties are in ../systematics/ (shared with DL) and systematics/ (SL only).
