# HH->bbWW SL datacards: the settings shared by sl_spin0.yaml and sl_spin2.yaml (as DL/dl_common.yaml),
# which include it with ../common.yaml (the settings of every card), the signals and the uncertainty
# files. Not a card on its own. The merge is strict: anything set in two files is an error.
#
# FIRST VERSION, expected (Asimov) limits only: the inputs have no fake / QCD-multijet background
# yet (the W+jets CR has data/MC 1.3-1.8 in v2610_TwoStageDNN_Outputs_v2), so no observed limit
# and no fit to CR data until the fake estimate is added as a background.
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  # The binary score of the two-stage SL DNN (a logit, -23.5:23.5), parametrised in the mass, 1D
  # in each HME sub-region (flavour Signal_Extraction_SL_window, Run3_Model: DY not split).
  input_file_pattern: ${ERA}/TwoStageDNN_M${MX}_binary/TwoStageDNN_M${MX}_binary.root
channels:
  - e
  - mu
# SR (equal-signal DNN bins) and the TT / W+jets control regions (equal-background bins), each in
# its jet category's HME window: the sub-regions <region>_HMESub_m<MX> of the booking plugin
# (config/sub_regions/hme_SL_v2610.yaml, the [16, 84] % signal window). The CRs are the DNN's TT
# and W+jets classes (#191) in the same window. No "/" in the names (bin and MC-stat nuisance
# names); input_categories maps them to the inputs. The other CR_SL_* classes are not fitted:
# CR_SL_ST and CR_SL_H are ~80-95 % TT, CR_SL_DY and CR_SL_VV mostly W+jets and fakes.
categories:
  - SR_res2b
  - SR_boosted
  - SR_recovery
  - TT_res2b
  - TT_boosted
  - TT_recovery
  - W_res2b
  - W_boosted
  - W_recovery
input_categories:
  SR_res2b: SR_SL_HMESub_m${MX}/res2b
  SR_boosted: SR_SL_HMESub_m${MX}/boosted
  SR_recovery: SR_SL_HMESub_m${MX}/recovery
  TT_res2b: CR_SL_TT_HMESub_m${MX}/res2b
  TT_boosted: CR_SL_TT_HMESub_m${MX}/boosted
  TT_recovery: CR_SL_TT_HMESub_m${MX}/recovery
  W_res2b: CR_SL_WJets_HMESub_m${MX}/res2b
  W_boosted: CR_SL_WJets_HMESub_m${MX}/boosted
  W_recovery: CR_SL_WJets_HMESub_m${MX}/recovery

# The DL preprocess step (see dl_common.yaml): merges the backgrounds, bins the DNN score of each
# sub-region (SR: equal signal; CRs: equal background) and carries the QCD-scale / PDF members to
# the final bins. The binning configuration holds the binning only; to reuse saved edges, replace
# it by --edges <a binning.json of this step>.
preprocess:
  script: Analysis/EqualSignalBinning.py
  args:
    - --binning-config
    - config/Datacards/SL/binning_eqsig_SL_v2610.yaml
    - --jobs
    - "8"

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true

  # SR window background (4 eras, MX 300 -> 800): TT 77-91 % -> 52-80 %, W 2-11 % -> 9-35 %,
  # ST 6-10 %, DY 0.4-4 %, VV + VVV + ttV + H 1-2 %. Merged as in DL where the processes are the
  # same (TT with ttV; Minor), with W a background of its own (in DL it is in Minor).
  - process: TT
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    preprocess:
      members: [ TT, ttV ]

  - process: W
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  # not mass-split (Run3_Model), unlike DL's DY_M_10to50 + DY_M_50
  - process: DY
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: Minor
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true
    preprocess:
      members: [ VV, VVV, H ]

# The uncertainties are in ../systematics/ (shared with DL) and systematics/ (SL only).
