# HH->bbWW SL datacards, spin-0 (radion) signal hypothesis.
# Shared with sl_spin2.yaml: everything but the signals and the limit plots; the signals, with their
# BR and theory uncertainties, and every uncertainty file of ../systematics/ are shared with the DL
# card of this spin (DL/dl_spin0.yaml), so the two combine with correlated nuisances.
include:
  # settings of every card (eras, fit and plot settings)
  - ../common.yaml
  # uncertainties shared by all cards (every file of ../systematics/)
  - ../systematics/luminosity.yaml
  - ../systematics/leptons.yaml
  - ../systematics/jets.yaml
  - ../systematics/parton_shower.yaml
  - ../systematics/dy_reweighting.yaml
  # SL-only uncertainties (every file of systematics/)
  - systematics/theory.yaml
  - systematics/normalisations.yaml
  - systematics/fakes.yaml
  - sl_common.yaml
  # the signals of this spin, with their uncertainties (shared with DL/dl_spin0.yaml)
  - ../signals/spin0.yaml

# Compared with the Run 2 SL expected limit of the same spin (run2_external_limits.json, SL/: recomputed from the
# HIG-21-005 SL cards, which include a data-driven fake background, as these cards do).
limit_plots:
  - name: spin0_sl
    bands: true
    datacards:
      - { name: "Early Run 3 SL spin-0 (radion)", glob: "*.txt" }
    external_limits:
      - { file: config/Datacards/run2_external_limits.json, key: "SL/spin0" }
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1600
      y_min: 0.002
      y_max: 1000  # the SL limit peaks at ~10 pb: below the legend at 1000, faded under it at 100

  - name: spin0_channels
    datacards:
      - { name: "Combined spin-0 (radion)", glob: "*.txt" }
      - { name: "e", glob: "${ERA}/e/*.txt" }
      - { name: "#mu", glob: "${ERA}/mu/*.txt" }
    plot_params: *limit_plot_style

  - name: spin0_categories
    datacards:
      - { name: "Combined spin-0 (radion)", glob: "*.txt" }
      # each jet category (dhi combines the cards of one mass)
      - { name: "res 2b", glob: "${ERA}/categories/*_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/*_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/*_boosted/*.txt" }
    plot_params: *limit_plot_style
