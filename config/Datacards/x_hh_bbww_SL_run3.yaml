analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: SL_DNN_m${MX}_vs_HME/SL_DNN_m${MX}_vs_HME.root
signalFractionForRelevantBins: 0.2
eras:
  # - Run3_2022
  # - Run3_2022EE
  # - Run3_2023
  - Run3_2023BPix
channels:
  - mu
  - e
categories:
  - ZVeto_OS_Iso/res2b
  - ZVeto_OS_Iso/boosted
  - ZVeto_OS_Iso/recovery
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  # The spin-0 (Radion) X->HH signal. Run3_Model histograms every hypothesis; this card picks one.
  # A spin-2 card is this file with GluGluToBulkGraviton_bbWW_SL in place of GluGluToRadion_bbWW_SL.
  - process: GluGluToRadion_bbWW_SL_${MX}
    hist_name: GluGluToRadion_bbWW_SL_${MX}
    # the produced X->HH points up to 1.5 TeV; the DNN has to be retrained over this
    # grid before these cards can be built
    param_values: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500 ]
    is_signal: true
    # 125.0 H->bb BR 5.824e-01 https://twiki.cern.ch/twiki/bin/view/LHCPhysics/CERNYellowReportPageBR
    # 125.0 H->WW BR 2.137e-01
    # 125.0 H->ZZ BR 2.619e-02
    # W->lv 10.86e-02 https://pdg.lbl.gov/2019/listings/rpp2019-list-w-boson.pdf
    # W->hadrons BR 67.41e-02 (1 - 3 * 10.86e-02)
    # Z->ll 3.3658e-02
    # Z->invisible 20e-02
    # scale: 2 * 5.824e-01 * ( 2.137e-01 * 3 * 10.86e-02 * 3 * 10.86e-02 + 2 * 2.619E-02 * 3 * 3.3658e-02 * 20e-02)
    # The single-lepton sample is 2B2JLNu. Its fragment leaves all W modes open and picks the
    # semileptonic final state with ResonanceDecayFilter (daughters = 5,5,1,1,11,12); what matters
    # here is that it enables only H->bb and H->WW, not H->ZZ as the dilepton one does, so no Z term
    # enters. Single Lepton case replaces the second W->lv with a W->hadrons.
    scale: 2 * 5.824e-01 * ( 2.137e-01 * 2 * (3 * 10.86e-02 * 67.41e-02))
  - TT
  # - DY
  # - VV
  - ST
  - W
  # - Other
uncertainties:
  - name: lumi_13p6TeV
    type: lnN
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3


  # - name: MuonID_TightID
  # These sources are decorrelated across eras, so config/Run3_<era>/weights.yaml
  # writes them with the era suffix and the datacard has to name the era it wants.
  # This configuration covers Run3_2023BPix only; adding another era here means
  # adding that era's entries too. CMS_scale_j is deliberately unsuffixed -- JES
  # `Total` stays correlated, see x_hh_bbww_DL_run3.yaml for why.
  - name: CMS_eff_m_id_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  # - name: MuonID_TightIDIso
  - name: CMS_eff_m_id_iso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: EleID_TightIDIso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: SingleEleTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: SingleMuonTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix


  - name: CMS_pileup_2023BPix
    type: shape
    eras:
      - Run3_2023BPix


  - name: CMS_scale_j
    type: shape
  - name: CMS_res_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_scale_e_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # Parton shower ISR/FSR. No `eras:` and no `processes:` -- one correlated nuisance
  # each, applied to every process including signal, because it is one Pythia shower
  # setting varied in every sample. Shape-only: the inclusive yield is normalised away
  # in the producer, so what reaches the card is acceptance alone.
  #
  # Expect ps_fsr to be resolved to lnN or dropped in some categories by autolnNThr /
  # ignorelnNThr. For a shape-only nuisance that is correct: a category whose acceptance
  # barely moves should drop out.
  - name: ps_isr
    type: shape
  - name: ps_fsr
    type: shape


  # For multiple values, Konstantin says do [ down, up ]
  - name: QCD_scale_TT
    type: lnN
    processes:
      - TTno4Q
    value: [ -0.036, 0.025 ] # TT XS uncertainty in percentage from xsec yaml
    # TT:
    # crossSec: '923.6'
    # reference: https://twiki.cern.ch/twiki/bin/view/LHCPhysics/TtbarNNLO#Updated_reference_cross_sections
    # unc: +22.6 -33.4 (scale) +/-  22.8 (PDF alphas) -24.6 +25.4 (mass) (to be multiplied by the BR)

  - name: QCD_scale_DY
    type: lnN
    processes:
      - DY
    value: [ -0.011, 0.007 ] # DY XS uncertainty in percentage from xsec yaml
    # DY_NNLO_QCD+NLO_EW:
    # crossSec: 2094.2 * 3
    # reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/MATRIXCrossSectionsat13p6TeV
    # unc: +0.7% - 1.1%, +- 1.0% PDF alphas

  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  - name: QCD_scale_VV
    type: lnN
    processes:
      - VV
    value: 0.005 # This was uncertainty from XSDB

  - name: PDF_alphas
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.025
        type: lnN
        processes:
          - TT
      - value: 0.01
        type: lnN
        processes:
          - DY
      - value: 0.027
        type: lnN
        processes:
          - ST

  - name: top_mass
    hasMultipleValues: True
    type: lnN
    value:
      - value: [ -0.027, 0.028 ]
        type: lnN
        processes:
          - TT
      - value: [ -0.015, 0.015 ] # Taken from tW for now (largest unc percentage)
        type: lnN
        processes:
          - ST

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1
