analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_m${MX}_vs_HME/DNN_m${MX}_vs_HME.root
signalFractionForRelevantBins: 0.2
# Every era listed here gets its own binning, its own datacards and its own limit.
#
# The four sub-eras are off for now. None of them builds standalone: on a single era's
# statistics a handful of DY shapes go negative beyond tolerance in the sparsest DNN
# slices, and resolveNegativeBins rejects them. Measured over 4 mass points, of ~500
# background shapes each -- 2022: 5 rejected, 2022EE: 5, 2023: 2, 2023BPix: 6, and
# Run3_Early: 0. It does not track luminosity; it tracks where DY's negative-weight
# events land. Turning them back on wants either min_slice_bkg_each_neff on in
# config/Datacards/binning_2d.yaml, so those slices are never cut, or a looser
# max_n_sigma_for_negative_bins for DY.
#
# They stay in era_groups below regardless: Run3_Early is the combination of all four
# datasets, which is a statement about the data, not about which limits we set.
eras:
  # - Run3_2022
  # - Run3_2022EE
  # - Run3_2023
  # - Run3_2023BPix
  - Run3_Early
era_groups:
  Run3_Early:
    - Run3_2022
    - Run3_2022EE
    - Run3_2023
    - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
# The datacard bins, exactly as they exist in the input shapes. These are what
# StatInference/bin_opt_2d/rebin_2d.py wrote when it cut each base category into DNN
# slices -- the chain does no slicing of its own, it reads the directories it is given.
categories:
  - SR/res2b_dnn0
  - SR/res2b_dnn1
  - SR/res2b_dnn2
  - SR/res2b_dnn3
  - SR/boosted_dnn0
  - SR/boosted_dnn1
  - SR/boosted_dnn2
  - SR/boosted_dnn3
  - SR/recovery_dnn0
  - SR/recovery_dnn1
  - SR/recovery_dnn2
  - SR/recovery_dnn3

# How to take those names apart again, to group the slices of one base category for the
# per-category limits. Must match the category_pattern rebin_2d.py wrote them with.
category_pattern: "{base_category}_dnn{slice_idx}"

# Applied to the merged histograms before the datacards are built, by
# PreprocessShapesTask. The chain knows nothing about what this does -- it supplies
# --input, --output, --era and --config, and the script writes
# "<era>/<variable>/<variable>.root". Here it cuts the 2D DNN-vs-HME shapes into
# per-slice 1D ones; the knobs that steer that are in binning_2d.yaml, and the binning it
# derives is written beside the shapes it produced. Remove this block and the chain reads
# the merged histograms unchanged.
preprocess:
  script: StatInference/bin_opt_2d/rebin_2d.py
  args:
    - --binning-config
    - config/Datacards/binning_2d.yaml

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    # A sparse (channel, category, MX) signal region can have a shape
    # systematic (e.g. CMS_eff_m_id up/down) that shifts all surviving MC
    # events out of the rebinned range entirely -- a genuine all-zero shape,
    # not a negative-bin issue. Allow it; resolveType/canIgnore downstream
    # decides whether the systematic is negligible.
    allow_zero_integral: true
  - process: XtoHHto2Tau2B_${MX}
    hist_name: XtoHHto2Tau2B_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    # X -> HH -> bb tautau also reaches this dilepton selection (tau -> l nu nu),
    # so it is signal here rather than background, scaled by the same signal
    # strength as the bbWW mode. It is a much smaller contribution and can be
    # entirely empty in a sparse (channel, category, MX) slice.
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: TT
    # Sparse tail DNN slices (e.g. the recovery/dnn3 catch-all bin) have low
    # enough MC statistics that a shape systematic's up/down variation can
    # dip a bin negative within error -- same statistical-noise pattern as
    # DY/VV below, not specific to any one background.
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: DY
    channels:
      - eE
      - muMu
    # DY's aMC@NLO negative-weight events can push a single era's shape
    # negative within error in any category, not just sparse ones like
    # boosted -- seen in res2b too for standalone single-era datacards.
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: VV
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true
  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  # Single merged background template for the boosted slices, all three channels.
  #
  # Why: DY has no usable MC statistics in the b-tagged same-flavour categories.
  # Measured on Run3_Early (v2605a), summed over the four sub-eras, DY's effective
  # MC count (yield/error)^2 has a median of 5.8 across the 232 eE/muMu SR slices
  # and sits below the binning's own min_slice_bkg_neff of 4 in 42% of them, with several
  # slices going negative outright. TT, ST and VV are all fine on their own (median
  # N_eff 471 / 211 / 97, never below 4). So this is a DY problem, not a binning
  # granularity problem -- there is no 4-slice DNN binning of eE/muMu in which DY is
  # individually well measured, and merging DNN slices to chase it only buys a
  # positive number that is still statistically meaningless.
  #
  # Why all four rather than only the small ones: over the 64 boosted slices,
  # merging DY+ST+VV alone leaves 2 negative bins (eE/SR/boosted_dnn1 at m500);
  # including TT leaves none anywhere. Those last 2 bins are consistent with zero
  # and have 10x their size in positive donors, but the mass axis is binned by equal
  # signal quantiles, so every bin of an n<=5 bin slice holds >= 1/n >= 20% of the
  # signal and is therefore "relevant" under signalFractionForRelevantBins: 0.2 --
  # and resolveNegativeBins rejects a negative relevant bin unconditionally,
  # regardless of allow_negative_bins_within_error. Merging TT in as well avoids
  # relying on that interaction at all: no negative bins, nothing to tolerate.
  #
  # Cost, stated plainly: boosted has one background rate instead of four, so TT
  # cannot float independently there and the template's composition is frozen at the
  # MC prediction. Accepted because boosted holds 2-80 background events per slice
  # with no dedicated control region, and because autoMCStats (threshold 20, mode 1)
  # was already pooling these bins' MC-stat uncertainty across processes.
  #
  # `subprocesses` naming other datacard processes replaces them here, so TT, DY, ST
  # and VV keep their configuration above and simply do not enter the boosted bins.
  #
  # eMu is included as well. DY is restricted to eE/muMu in its own entry above and
  # was therefore missing from eMu's boosted background entirely -- not because it is
  # negligible there: over the 32 eMu boosted slices DY is 0.5% to 32% of the total
  # background (median 6.5%), with N_eff 1.2-22 (median 5.9, a third of slices below
  # 4). Merging is what lets it be counted, since the merged shape is assembled from
  # subprocess histograms by path and does not consult DY's own channel list. So eMu
  # boosted gains a real background it was previously missing, its DY never has to
  # stand on its own statistics, and all three channels now describe their boosted
  # background the same way. Folding DY in leaves zero negative bins in all 32 eMu
  # slices. DY remains absent from eMu res2b/recovery, which are unchanged.
  #
  # Caveat: QCD_scale_TT/DY/ST/VV each match this process through its subprocesses
  # (Uncertainty.appliesTo) and so apply to the whole merged yield rather than to
  # their own constituent's share. TT dominates boosted, so QCD_scale_TT is roughly
  # right; the other three over-cover. Net effect is a ~4.4% XS uncertainty where a
  # yield-weighted treatment would give ~3% -- conservative, and small next to the
  # MC-statistical noise this merge exists to remove.
  #
  # No negative-bin tolerance is set below on purpose: there are no negative bins to
  # tolerate, and this template builds under the unmodified resolveNegativeBins.
  - process: TotalBkg
    subprocesses:
      - TT
      - DY
      - ST
      - VV
    categories:
      - SR/boosted
  # - W
  # - Other
uncertainties:
  # Split per year rather than per era: the luminosity calibration is a per-year
  # measurement, so 2022 and 2022EE share a nuisance and 2023 and 2023BPix share
  # another. This is lnN, so it needs nothing from the producer -- the meta-era lnN
  # path already evaluates `eras:` against the sub-eras.
  #
  # NOTE: both magnitudes are still the old flat 1.4%. Only the correlation model has
  # been fixed here; the per-year values need to be taken from the current LUM
  # recommendation (which also splits a correlated from an uncorrelated component,
  # not implemented here).
  - name: lumi_13p6TeV_2022
    type: lnN
    eras:
      - Run3_2022
      - Run3_2022EE
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3
  - name: lumi_13p6TeV_2023
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.014 # TODO: per-year LUM value


  # - name: MuonID_TightID
  - name: CMS_eff_m_id_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  # - name: MuonID_TightIDIso
  - name: CMS_eff_m_id_iso_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_iso_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_iso_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_iso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: EleID_TightIDIso_2022
    type: shape
    eras:
      - Run3_2022
  - name: EleID_TightIDIso_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: EleID_TightIDIso_2023
    type: shape
    eras:
      - Run3_2023
  - name: EleID_TightIDIso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: SingleEleTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleEleTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleEleTrg_2023
    type: shape
    eras:
      - Run3_2023
  - name: SingleEleTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: SingleMuonTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleMuonTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleMuonTrg_2023
    type: shape
    eras:
      - Run3_2023
  - name: SingleMuonTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix


  # Decorrelated per era: the pileup profile and the minimum-bias cross section
  # are derived per era. The era suffix is produced by config/Run3_<era>/weights.yaml
  # -- the nuisance name is also the histogram name, so it cannot be added here.
  - name: CMS_pileup_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_pileup_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_pileup_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_pileup_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # BTV shape calibration, registered in config/Run3_*/weights.yaml. Correlated
  # across the four Run 3 eras -- the BTV per-era split of the *stats* sources needs
  # meta-era support that dc_make does not have yet (see docs/stat_inference.md).
  # In boosted categories the variation is neutralised at weight level, so these are
  # dropped there automatically by the canIgnore threshold.
  - name: CMS_btag_LF
    type: shape
  - name: CMS_btag_HF
    type: shape
  - name: CMS_btag_lfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_lfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_cferr1
    type: shape
  - name: CMS_btag_cferr2
    type: shape

  # AK8 calibration, registered in config/Run3_*/weights.yaml. Neutralised at
  # weight level for resolved events, so canIgnore drops these outside boosted.
  # Decorrelated: Corrections/fatjet.py loads one of four separate calibration files,
  # so these are four independent fits.
  - name: CMS_bbww_ak8_Hbb_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_Hbb_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_Hbb_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_Hbb_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_ak8_Hcc_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_Hcc_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_Hcc_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_Hcc_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_ak8_tau21_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_tau21_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_tau21_2023
    type: shape
    eras:
