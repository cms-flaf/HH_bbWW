analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_m${MX}_vs_HME/DNN_m${MX}_vs_HME.root
signalFractionForRelevantBins: 0.2
# Every era listed here gets its own binning, its own datacards and its own limit.
#
# The four sub-eras are off for now. None of them builds standalone: on a single era's
# statistics a handful of DY shapes go negative beyond tolerance in the sparsest DNN
# slices, and resolveNegativeBins rejects them. Measured over 4 mass points, of ~500
# background shapes each -- 2022: 5 rejected, 2022EE: 5, 2023: 2, 2023BPix: 6, and
# their combination: 0. It does not track luminosity; it tracks where DY's negative-weight
# events land. Turning them back on wants either min_slice_bkg_each_neff on in
# config/Datacards/binning_2d.yaml, so those slices are never cut, or a looser
# max_n_sigma_for_negative_bins for DY. (Measured with binning_2d.yaml.)
#
# They stay in era_groups below regardless: Run3_22_23 is the combination of all four
# datasets, which is a statement about the data, not about which limits we set. The name
# is the meta-era's of global.yaml's era_groups, whose plot style (config/plot/Run3_22_23.yaml)
# the shape plots of the datacard step use.
eras:
  # - Run3_2022
  # - Run3_2022EE
  # - Run3_2023
  # - Run3_2023BPix
  - Run3_22_23
era_groups:
  Run3_22_23:
    - Run3_2022
    - Run3_2022EE
    - Run3_2023
    - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
# One datacard category per region and jet category, all in the frozen HME window of the jet
# category (hme_windows_DL_v2610.yaml):
#   SR_* : m_ll < 70 GeV, the DNN score in equal-signal bins;
#   TT_* : TT_CR, m_ll > 110 GeV, one bin;
#   DY_* : DY_CR, |m_ll - mZ| < 10 GeV, one bin.
# The control regions fix the TT and DY normalisations (the rateParams below). The names carry no
# "/" (they become the datacard bin names, and with them the names of the per-bin MC-stat
# nuisances, which dhi's impact merging cannot handle with a "/"); input_categories maps each to
# its directory in the histogram files.
categories:
  - SR_res2b
  - SR_boosted
  - SR_recovery
  - TT_res2b
  - TT_boosted
  - TT_recovery
  - DY_res2b
  - DY_boosted
  - DY_recovery
input_categories:
  SR_res2b: SR/res2b
  SR_boosted: SR/boosted
  SR_recovery: SR/recovery
  TT_res2b: TT_CR/res2b
  TT_boosted: TT_CR/boosted
  TT_recovery: TT_CR/recovery
  DY_res2b: DY_CR/res2b
  DY_boosted: DY_CR/boosted
  DY_recovery: DY_CR/recovery

# Applied to the merged histograms before the datacards are built, by
# PreprocessShapesTask. The chain knows nothing about what this does -- it supplies
# --input, --output, --era and --config, and the script writes
# "<era>/<variable>/<variable>.root". Here it cuts each category's HME window out of the 2D
# shapes, merges the merged-histogram processes into the backgrounds below and bins the DNN
# inside the window into bins of equal signal (binning_eqsig_DL_v2610.yaml). Its input is the
# Run3_Model_DYSplit merged histograms (DY as DY_M_10to50 + DY_M_50), e.g. --hists-version
# v2610_output_DYSplit. Remove this block and the chain reads the merged histograms unchanged.
preprocess:
  script: Analysis/EqualSignalBinning.py
  args:
    - --binning-config
    - config/Datacards/binning_eqsig_DL_v2610.yaml

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true

  # The spin-0 (Radion) X->HH signal. Run3_Model histograms every hypothesis; this card picks one.
  # A spin-2 card is this file with GluGluToBulkGraviton_bbWW_2L and GluGluToBulkGraviton_bbTauTau
  # in place of GluGluToRadion_bbWW_2L and GluGluToRadion_bbTauTau (process names and the
  # uncertainty patterns below), and wants its own binning.
  - process: GluGluToRadion_bbWW_2L_${MX}
    hist_name: GluGluToRadion_bbWW_2L_${MX}
    # the produced X->HH points up to 1.5 TeV; the DNN has to be retrained over this
    # grid before these cards can be built
    param_values: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500 ]
    is_signal: true
    allow_zero_integral: true

  - process: GluGluToRadion_bbTauTau_${MX}
    hist_name: GluGluToRadion_bbTauTau_${MX}
    param_values: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500 ]
    is_signal: true
    allow_zero_integral: true

  # The backgrounds are made by the preprocess step from the merged-histogram processes
  # (binning_eqsig_DL_v2610.yaml: backgrounds):
  #   TT         = TT + ttV
  #   DY         = DY_M_10to50 + DY_M_50, normalised in DY_CR; low-mass DY in SR boosted
  #                estimated from SR recovery, none in the control regions; in SR eE/muMu
  #                resolved and SR boosted a smooth template replaces the DY MC (dy_template)
  #   ST
  #   Minor      = VV + VVV + H + W (W in recovery only)
  # The binning only closes a bin once each of them passes its gates, for the nominal and every
  # variation, so none of them has negative or single-event bins; the tolerances below are
  # kept as a safety net.
  - process: TT
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  # All three channels. In eMu DY is mostly DY->tautau and is not small where the signal
  # is: v2610, Run3_2022+2023+2023BPix, it is 16-56% of the background in the bins
  # holding the best half of the signal at MX = 800-1200 (eMu recovery at 1200: 56%).
  - process: DY
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: Minor
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true

uncertainties:
  # Luminosity, as the Run 3 recommendation splits it: one component correlated across
  # all four eras but with a different size in each year group, and a second carried by
  # 2023 alone. Not a per-year uncorrelated pair -- that would treat the two year groups
  # as independent, which they are not.
  #
  # lumi_1 is one nuisance whose value depends on the era. Under a meta-era the datacard
  # maker cannot express that as a single lnN on the summed yield, so it builds the
  # variation sub-era by sub-era and writes it as a shape; each sub-era contributes its
  # own factor, and the ratio to nominal comes out as the yield-weighted blend.
  #
  # Reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/LumiRecommendationsRun3?extralog=-%20caching%20topic#Correlations_between_years_and_c
  - name: lumi_1_13p6TeV
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.0138
        type: lnN
        eras:
          - Run3_2022
          - Run3_2022EE
      - value: 0.0017
        type: lnN
        eras:
          - Run3_2023
          - Run3_2023BPix
  - name: lumi_2_13p6TeV
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.0127

