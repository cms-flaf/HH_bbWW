  - name: CMS_scale_j
    type: shape
  # JER is measured per era, so it is decorrelated -- one source, one measurement
  # per era, no ambiguity.
  #
  # JES (CMS_scale_j above) is the one source left correlated, and not because the
  # question is open: `Total` is the quadrature sum of a family that JME prescribes
  # be correlated (FlavorQCD, RelativeBal, HF, BBEC1, EC2, Absolute) and a per-year
  # family (BBEC1_, Absolute_, EC2_, HF_, RelativeSample_ -- Corrections/jet.py).
  # Whichever correlation is assigned to Total, one family is wrong: correlating it
  # lets the fit constrain the year-dependent pieces coherently across four eras,
  # decorrelating it averages FlavorQCD down as if it were four measurements. It is
  # kept correlated because FlavorQCD dominates for a bb final state and diluting it
  # is the worse error. The real fix is switching JetCorrProducer to the regrouped
  # sources -- note `use_regrouped` is never passed (Corrections/Corrections.py), so
  # that needs a code change and a full anaTuple re-production, not a config flip.
  - name: CMS_res_j_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_res_j_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_res_j_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_res_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_scale_e_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_scale_e_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_scale_e_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_scale_e_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  # Muon momentum scale/resolution. Registered in config/Run3_<era>/weights.yaml as
  # ScaRe; the correction was already applied at AnaTuple stage for these eras but no
  # variation was ever produced, so the analysis had an electron energy scale nuisance
  # and no muon counterpart. Decorrelated: MuonEnergyScale_corr.py loads a per-period
  # JSON, so like CMS_scale_e it is a per-era measurement.
  - name: CMS_ScaRe_mu_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_ScaRe_mu_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_ScaRe_mu_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_ScaRe_mu_2023BPix
    type: shape
    eras:
      - Run3_2023BPix


  # For multiple values, Konstantin says do [ down, up ]
  - name: QCD_scale_TT
    type: lnN
    processes:
      - TT
    value: [ -0.036, 0.025 ] # TT XS uncertainty in percentage from xsec yaml
    # TT:
    # crossSec: '923.6'
    # reference: https://twiki.cern.ch/twiki/bin/view/LHCPhysics/TtbarNNLO#Updated_reference_cross_sections
    # unc: +22.6 -33.4 (scale) +/-  22.8 (PDF alphas) -24.6 +25.4 (mass) (to be multiplied by the BR)

  - name: QCD_scale_DY
    type: lnN
    processes:
      - DY
    value: [ -0.011, 0.007 ] # DY XS uncertainty in percentage from xsec yaml
    # DY_NNLO_QCD+NLO_EW:
    # crossSec: 2094.2 * 3
    # reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/MATRIXCrossSectionsat13p6TeV
    # unc: +0.7% - 1.1%, +- 1.0% PDF alphas

  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  - name: QCD_scale_VV
    type: lnN
    processes:
      - VV
    # WARNING: this is not a QCD scale uncertainty. XSDB's `unc` field is an absolute
    # uncertainty in pb on its own Monte-Carlo integration, and 0.005 is just that
    # number divided by the cross section (WW 0.3733/80.23 = 0.47%, WZ 0.1318/29.1 =
    # 0.45%, ZZ 0.0649/12.75 = 0.51%; FLAF/config/crossSections13p6TeV.yaml:1051-1209).
    # The real NNLO diboson scale uncertainty is several percent. Needs replacing with a
    # number from the diboson theory reference; left as-is rather than guessed.
    value: 0.005

  - name: PDF_alphas
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.025
        type: lnN
        processes:
          - TT
      - value: 0.01
        type: lnN
        processes:
          - DY
      - value: 0.027
        type: lnN
        processes:
          - ST

  - name: top_mass
    hasMultipleValues: True
    type: lnN
    value:
      - value: [ -0.027, 0.028 ]
        type: lnN
        processes:
          - TT
      - value: [ -0.015, 0.015 ] # Taken from tW for now (largest unc percentage)
        type: lnN
        processes:
          - ST

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

# Overlay limit plots built by PlotResonantLimitsTask, one dhi
# PlotMultipleResonantLimits per entry, for each top-level era in `eras` above.
#
# Each `datacards` glob is relative to that era's datacard directory
# (data/<version>/Datacards[/<binning tag>]/<era>) and may use ${ERA}. The layout it
# addresses is the one DatacardMaker.writeDatacards produces: the era-combined cards sit
# at the top, per-channel cards under <era>/<channel>/, and per-base-category cards under
# <era>/categories/<CAT>/.
#
# `name` values must not contain braces -- law brace-expands datacard_names, so "fb^{-1}"
# would arrive as "fb^-1". Put that information in the campaign label instead.
# `plot_params` keys are passed straight through to PlotMultipleResonantLimits.

# dhi campaign key per era, supplying the luminosity/energy label. Every era listed in
# `eras` above that is plotted needs one: it cannot be derived from the era name, and dhi
# draws an unknown key verbatim rather than failing. Keys come from
# dhi.config.campaign_labels; the sub-era entries there are named by year, not by the
# FLAF period name.
campaigns:
  Run3_Early: run3_early
  Run3_2022: "2022preEE"
  Run3_2022EE: "2022postEE"
  Run3_2023: "2023preBPix"
  Run3_2023BPix: "2023postBPix"

limit_plots:
  - name: run3_vs_run2
    # Also draw the standard single-curve plot with the +-1/+-2 sigma bands, which the
    # overlay cannot show. This entry's one curve is the full combined result, so this is
    # the headline limit plot. The external Run 2 limits and the projection below are
    # separate curves rather than datacards, so they appear only on the overlay.
    bands: true
    datacards:
      - { name: "Early Run 3", glob: "*.txt" }
    # Statistical extrapolation of the curve above, recomputed from the limits produced
    # by this very run -- it is a function of the measured result, so it must never be a
    # stored file that survives a rebinning. lumi_now defaults to the campaign's own
    # luminosity (dhi.config.campaign_lumis), so it cannot disagree with the label drawn
    # beside it. Optimistic: the scaling assumes the systematics shrink with the data.
    lumi_projections:
      - name: "Early Run 3 scaled to 138 fb^{-1}"
        lumi_target: 138
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    # campaign is filled per era from the `campaigns` map above, so it is deliberately
    # absent here -- putting it in this shared anchor would stamp one era's luminosity
    # on every era's plot.
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1000
      y_min: 0.001
      y_max: 100

  - name: channels
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "ee", glob: "${ERA}/eE/*.txt" }
      - { name: "e#mu", glob: "${ERA}/eMu/*.txt" }
      - { name: "#mu#mu", glob: "${ERA}/muMu/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

  - name: categories
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "res 2b", glob: "${ERA}/categories/SR_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/SR_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/SR_boosted/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

# Nuisance pulls and impacts, drawn by PlotPullsAndImpactsTask into
# <version>/ImpactPlots/<name>/<era>/<mass>/.
#
# This entry has no `glob:`, so it uses the combined card ResonantLimitsTask writes --
# every era and every category in one fit. To rank one category instead, give an entry a
# glob addressing its card, e.g.
#
#   - name: res2b
#     glob: "${ERA}/categories/SR_res2b/*.txt"
#
# The glob and the mass must select exactly one card: PullsAndImpacts fits a single
# workspace.
impact_plots:
  - name: combined
    masses: [ 300, 600, 800 ]
    # The Asimov dataset is built at this signal strength. It has to be near the limit to
    # mean anything: dhi's default is r=1, which at 300 (limit ~6.8) is an almost
    # invisible signal so the ranking is really the background-only one, and at 800
    # (limit ~0.065) is ten times more signal than can be excluded, which pins r and
    # collapses every impact towards zero. "limit" takes the expected limit at each mass
    # from the limits already merged for these cards; a number sets it explicitly.
    #
    # It reaches combine as --expectSignal through PullsAndImpacts' custom_args. It cannot
    # go through dhi's `parameter_values`: for a resonant search hh_model is NO_STR, and
    # POITask then hard-codes the joined parameter values to '""' and the output postfix
    # to r=1.0, so the value would be dropped without a word.
    #
    # WARNING: the fit's output path does not depend on it -- custom_args is significant
    # for task identity but not for the store path -- so changing this value does not move
    # the outputs. Clear <version>/PullsAndImpacts, MergePullsAndImpacts and
    # PlotPullsAndImpacts under inference/data/store before re-running with a different
    # one, or law will report the old fit as complete.
    poi_value: limit
    # Migrad fails on a few of these fits from a bad seed gradient -- at 300 it was
    # CMS_eff_m_id_iso_2023 -- and dhi aborts the whole merge rather than the branch, so
    # 80 converged fits produce nothing. MINIMIZER_no_analytic, which dhi suggests, tends
    # to move the failure to another parameter; falling back to Simplex converges it.
    # Anything here reaches combine through PullsAndImpacts' custom_args.
    fit_args:
      - --cminFallbackAlgo Minuit2,Simplex,0:0.1
    plot_params:
      # One combine job per nuisance per direction. `robust` would instead take a single
      # fit and invert the Hessian, which is far cheaper but drops any parameter it cannot
      # invert -- it silently lost all four CMS_scale_j_* on these cards. Per-parameter
      # fits are what a ranking should be built from.
      method: default
      order_by_impact: true
      # mc_stats would add a few hundred autoMCStats bins. If you turn it on, set
      # parameters_per_page as well (25 works) or the plot is one unreadable page -- the
      # task refuses the combination rather than drawing it.
      mc_stats: false
