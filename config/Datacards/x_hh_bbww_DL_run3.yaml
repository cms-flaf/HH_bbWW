    type: shape
    eras:
      - Run3_2023BPix

  # Parton shower ISR/FSR. No `eras:` and no `processes:` -- one correlated nuisance
  # each, applied to every process including signal, because it is one Pythia shower
  # setting varied in every sample. Shape-only: the inclusive yield is normalised away
  # in the producer, so what reaches the card is acceptance alone.
  #
  # Expect ps_fsr to be resolved to lnN or dropped in some categories by autolnNThr /
  # ignorelnNThr. For a shape-only nuisance that is correct: a category whose acceptance
  # barely moves should drop out.
  - name: ps_isr
    type: shape
  - name: ps_fsr
    type: shape


  # For multiple values, Konstantin says do [ down, up ]
  - name: QCD_scale_DY
    type: lnN
    processes:
      - DY
    value: [ -0.011, 0.007 ] # DY XS uncertainty in percentage from xsec yaml
    # DY_NNLO_QCD+NLO_EW:
    # crossSec: 2094.2 * 3
    # reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/MATRIXCrossSectionsat13p6TeV
    # unc: +0.7% - 1.1%, +- 1.0% PDF alphas

  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  # Theory and normalisation uncertainties of the members of merged backgrounds (TT = TT + ttV,
  # Minor = VV + VVV + H + W, and PDF_alphas across TT, ST, DY and Minor). The preprocess step
  # writes each as a shape of the merged background that moves only that member's own part, by
  # the member's own amount; the values and their sources are in binning_eqsig_DL_v2610.yaml
  # (member_uncertainties).
  - name: QCD_scale_TT
    type: shape
    processes: [ TT ]
  - name: QCD_scale_ttV
    type: shape
    processes: [ TT ]
  - name: top_mass
    type: shape
    processes: [ TT, ST ]
  - name: PDF_alphas
    type: shape
    processes: [ TT, ST, DY, Minor ]
  - name: CMS_bbww_minor_norm_VV
    type: shape
    processes: [ Minor ]
  - name: CMS_bbww_minor_norm_VVV
    type: shape
    processes: [ Minor ]
  - name: CMS_bbww_minor_norm_H
    type: shape
    processes: [ Minor ]
  # W is only in recovery (binning_eqsig_DL_v2610.yaml: drop), in every region
  - name: CMS_bbww_minor_norm_W
    type: shape
    processes: [ Minor ]
    categories: [ SR_recovery, TT_recovery, DY_recovery ]

  # The DY templates (binning_eqsig_DL_v2610.yaml: dy_template) replace the DY MC statistics in
  # the same-flavour resolved categories and in boosted; each window's fit uncertainty is its own
  # nuisance. Boosted eE and muMu share one fit, and so one nuisance.
  - name: CMS_bbww_dy_fit_eE_res2b
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_res2b ]
  - name: CMS_bbww_dy_fit_muMu_res2b
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_res2b ]
  - name: CMS_bbww_dy_fit_eE_recovery
    type: shape
    processes: [ DY ]
    channels: [ eE ]
    categories: [ SR_recovery ]
  - name: CMS_bbww_dy_fit_muMu_recovery
    type: shape
    processes: [ DY ]
    channels: [ muMu ]
    categories: [ SR_recovery ]
  - name: CMS_bbww_dy_fit_eE_muMu_boosted
    type: shape
    processes: [ DY ]
    channels: [ eE, muMu ]
    categories: [ SR_boosted ]
  - name: CMS_bbww_dy_fit_eMu_boosted
    type: shape
    processes: [ DY ]
    channels: [ eMu ]
    categories: [ SR_boosted ]

  # Low-mass DY in SR boosted is estimated from SR recovery into DY (binning_eqsig_DL_v2610.yaml:
  # lowmass_dy); +-100% on that estimate.
  - name: CMS_bbww_dy_lowmass
    type: shape
    processes: [ DY ]
    categories: [ SR_boosted ]

  # Low-mass DY (10 < m_ll < 50 GeV) is in no control region: both lie above 70 GeV. It is part of
  # DY, so it shares the normalisation DY_CR fixes, and has a prior of its own on top, a shape of DY
  # that moves only its low-mass part (binning_eqsig_DL_v2610.yaml: member_uncertainties). In SR
  # boosted it is the estimate instead (CMS_bbww_dy_lowmass); there is none in the control regions.
  - name: CMS_bbww_norm_DY_lowmass
    type: shape
    processes: [ DY ]
    categories: [ SR_res2b, SR_recovery ]

  # Free normalisations of TT (incl. ttV) and DY (m_ll > 50 GeV), each fixed by its control
  # region (TT_CR / DY_CR) and shared with the signal region of the same jet category, every
  # channel and every era. Boosted has ~100 events per era in either control region, so it
  # shares the res2b parameter.
  - name: CMS_bbww_rate_TT_res2b
    type: rateParam
    processes: [ TT ]
    categories: [ SR_res2b, TT_res2b, DY_res2b, SR_boosted, TT_boosted, DY_boosted ]
    value: 1.0
    range: [ 0.0, 5.0 ]
  - name: CMS_bbww_rate_TT_recovery
    type: rateParam
    processes: [ TT ]
    categories: [ SR_recovery, TT_recovery, DY_recovery ]
    value: 1.0
    range: [ 0.0, 5.0 ]
  - name: CMS_bbww_rate_DY_res2b
    type: rateParam
    processes: [ DY ]
    categories: [ SR_res2b, TT_res2b, DY_res2b, SR_boosted, TT_boosted, DY_boosted ]
    value: 1.0
    range: [ 0.0, 5.0 ]
  - name: CMS_bbww_rate_DY_recovery
    type: rateParam
    processes: [ DY ]
    categories: [ SR_recovery, TT_recovery, DY_recovery ]
    value: 1.0
    range: [ 0.0, 5.0 ]

  # Higgs branching ratios: theory, so correlated across every era -- no `eras:` field,
  # which is what makes them apply everywhere. Values from
  # https://gitlab.cern.ch/hh/naming-conventions#experimental-uncertainties
  #
  # GluGluToRadion_bbWW_1L is the single-lepton signal and is not a process of this dilepton
  # card; it belongs in these lists when the SL card gains them. The single-Higgs
  # background H is not in them: it mixes H->bb, WW and tautau in one histogram, and its
  # branching-ratio uncertainties (1-2 %) are small next to QCD_scale_H.
  #
  # BR_hww covers the whole bbWW signal although the sample is 2B2V: about 4.5 % of it is
  # H->ZZ->2l2nu, which this nuisance over-covers and BR_hzz does not cover at all.
  #
  # The process patterns are regexes (a `processes:` entry beginning with ^ is matched
  # with re.match, anything else compared literally). They have to be: by the time an
  # uncertainty is matched, the signal's ${MX} has been resolved to the mass being built,
  # so the process is GluGluToRadion_bbWW_2L_700 and a literal "GluGluToRadion_bbWW_2L_${MX}" matches
  # nothing at all -- silently, since an uncertainty that applies to no process is simply
  # never added.
  - name: BR_hbb
    type: lnN
    processes:
      - ^GluGluToRadion_bbWW_2L_
      - ^GluGluToRadion_bbTauTau_
    value: [ -0.0126, 0.0124 ]
  - name: BR_hww
    type: lnN
    processes:
      - ^GluGluToRadion_bbWW_2L_
    value: [ -0.0152, 0.0153 ]
  - name: BR_htt
    type: lnN
    processes:
      - ^GluGluToRadion_bbTauTau_
    value: [ -0.0163, 0.0165 ]

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

campaigns:
  # dhi's key for the four eras combined (its luminosity label)
  Run3_22_23: run3_early
  Run3_2022: "2022preEE"
  Run3_2022EE: "2022postEE"
  Run3_2023: "2023preBPix"
  Run3_2023BPix: "2023postBPix"

limit_plots:
  - name: run3_vs_run2
    # Draw 1/2 sigma bands
    bands: true
    datacards:
      - { name: "Early Run 3", glob: "*.txt" }
    lumi_projections:
      - name: "Early Run 3 scaled to 138 fb^{-1}"
        lumi_target: 138
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1000
      y_min: 0.001
      y_max: 100

  - name: channels
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "ee", glob: "${ERA}/eE/*.txt" }
      - { name: "e#mu", glob: "${ERA}/eMu/*.txt" }
      - { name: "#mu#mu", glob: "${ERA}/muMu/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

  - name: categories
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "res 2b", glob: "${ERA}/categories/SR_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/SR_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/SR_boosted/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

# Nuisance pulls and impacts, drawn by PlotPullsAndImpactsTask into
# <version>/ImpactPlots/<name>/<era>/<mass>/.
#
# This entry has no `glob:`, so it uses the combined card ResonantLimitsTask writes --
# every era and every category in one fit. To rank one category instead, give an entry a
# glob addressing its card, e.g.
#
#   - name: res2b
#     glob: "${ERA}/categories/SR_res2b/*.txt"
#
# The glob and the mass must select exactly one card: PullsAndImpacts fits a single
# workspace.
impact_plots:
  - name: combined
    masses: [ 300, 600, 800 ]
    # The Asimov dataset is built at this signal strength. It has to be near the limit to
    # mean anything: dhi's default is r=1, which at 300 (limit ~6.8) is an almost
    # invisible signal so the ranking is really the background-only one, and at 800
    # (limit ~0.065) is ten times more signal than can be excluded, which pins r and
    # collapses every impact towards zero. "limit" takes the expected limit at each mass
    # from the limits already merged for these cards; a number sets it explicitly.
    #
    # It reaches combine as --expectSignal through PullsAndImpacts' custom_args. It cannot
    # go through dhi's `parameter_values`: for a resonant search hh_model is NO_STR, and
    # POITask then hard-codes the joined parameter values to '""' and the output postfix
    # to r=1.0, so the value would be dropped without a word.
    #
    # WARNING: the fit's output path does not depend on it -- custom_args is significant
    # for task identity but not for the store path -- so changing this value does not move
    # the outputs. Clear <version>/PullsAndImpacts, MergePullsAndImpacts and
    # PlotPullsAndImpacts under inference/data/store before re-running with a different
    # one, or law will report the old fit as complete.
    poi_value: limit
    # Migrad fails on a few of these fits from a bad seed gradient -- at 300 it was
    # CMS_eff_m_id_iso_2023 -- and dhi aborts the whole merge rather than the branch, so
    # 80 converged fits produce nothing. MINIMIZER_no_analytic, which dhi suggests, tends
    # to move the failure to another parameter; falling back to Simplex converges it.
    # Anything here reaches combine through PullsAndImpacts' custom_args.
    fit_args:
      - --cminFallbackAlgo Minuit2,Simplex,0:0.1
    plot_params:
      # One combine job per nuisance per direction. `robust` would instead take a single
      # fit and invert the Hessian, which is far cheaper but drops any parameter it cannot
      # invert -- it silently lost all four CMS_scale_j_* on these cards. Per-parameter
      # fits are what a ranking should be built from.
      method: default
      order_by_impact: true
      # mc_stats would add a few hundred autoMCStats bins. If you turn it on, set
      # parameters_per_page as well (25 works) or the plot is one unreadable page -- the
      # task refuses the combination rather than drawing it.
      mc_stats: false
