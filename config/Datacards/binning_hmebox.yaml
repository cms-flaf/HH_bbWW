# Binning for the 2D -> 1D transformation, read by rebin_2d.py: an HME box with the DNN
# binned inside it.
#
# For each (mass, channel, base category) rebin_2d.py picks one contiguous HME window
# around the resonance, discards everything outside it, and bins the DNN score inside. Box
# and DNN binning are chosen together: a window is scored by the best DNN binning it
# admits, not by its own integrated significance, which would just widen it to swallow
# signal and ignore the shape the fit uses. Each base category becomes a single datacard
# bin, SR/res2b -> SR/res2b_hmebox0.
#
# Against the 2D DNN-slice binning with strategy dp this improves the expected
# limit by 5.3% on the geometric mean over MX = 500, 600, 800, 1000 (combined: +6.7%,
# +1.7%, -0.5%, +13.0%), with ~32% fewer fit bins. Boxes keep 60-99% of the signal,
# median ~89%. Studies/BinningScan/box_vs_dp_anatomy.py and bootstrap_bias.py are the
# checks that this is not overfitting (optimism bootstrap: 0.9% of Z^2 for the box, 1.4%
# for the 2D) and not the DNN bin count (capped at 3 DNN bins the box still gains 2.6%).
#
# Naming rule below: no infix means the summed background, _each means per background,
# _neff means effective MC entries rather than yield. Keys not set here take
# BINNING_DEFAULTS in rebin_2d.py.

strategy: hme_box
# One slice by construction: the box is the whole selection. slice_var labels the axis the
# box is cut on; the DNN is the binned axis.
n_slices: 1
slice_var: HME
# The datacard configuration reading these shapes must declare the same pattern.
category_pattern: "{base_category}_hmebox{slice_idx}"

# --- the box (the whole HME window) ---
min_slice_bkg_sum: 1.0
min_slice_bkg_neff: 4.0
min_slice_bkg_each: 0.01
min_slice_bkg_each_neff: 0.0

# --- the DNN bins inside it ---
max_bins_per_slice: 10
# Summed background to aim for per DNN bin; binning_2d.yaml uses 5.0.
bkg_per_bin: 1.0
min_bin_bkg_neff: 4.0
min_bin_bkg_each: 0.01
# Every non-exempt background must be measured, not merely positive, in every fit bin.
# This floor, not the bin budget, is what keeps the low-statistics DY out of bins it cannot
# support.
min_bin_bkg_each_neff: 2.0
# A DNN bin must raise the category's Z^2 by 0.2% of its achievable total, or it is given
# back.
dp_min_bin_gain: 0.002

# --- both ---
# Backgrounds below this fraction of the category total are exempt from the per-process
# floors. For the box the fraction is judged over the whole window, so a box holding DY
# just under 5% frees it from min_bin_bkg_each_neff in every bin, including bins where it
# is far more than 5% (muMu boosted MX=400: DY N_eff 0.17 over the box). Judging it bin by
# bin would close this; the numbers above were measured without that.
min_bkg_frac: 0.05
min_signal: 0.5
significance_mode: asimov
