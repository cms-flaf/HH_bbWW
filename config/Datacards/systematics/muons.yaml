# Muons: ID, ID+isolation and single-muon trigger scale factors.
#
# Included by every card that shares it -- DL/dl_spin{0,2}.yaml, SL/sl_spin{0,2}.yaml and the CI
# cards -- each listing every file of config/Datacards/systematics/ explicitly. The merge is strict
# (StatInference/common/card_config.py): an uncertainty is defined in one file only, and defining
# it again anywhere a card includes is an error, never an override.
uncertainties:
  # Muon ID
  - name: CMS_eff_m_id_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # Muon Iso
  - name: CMS_eff_m_id_iso_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_iso_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_iso_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_iso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # Muon Trigger
  - name: SingleMuonTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleMuonTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleMuonTrg_2023
    type: shape
    eras:
      - Run3_2023
  - name: SingleMuonTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
