# Jets: energy scale (JES) and resolution (JER).
#
# Included by every card that shares it -- DL/dl_spin{0,2}.yaml, SL/sl_spin{0,2}.yaml and the CI
# cards -- each listing every file of config/Datacards/systematics/ explicitly. The merge is strict
# (StatInference/common/card_config.py): an uncertainty is defined in one file only, and defining
# it again anywhere a card includes is an error, never an override.
uncertainties:
  - name: CMS_scale_j_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_scale_j_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_scale_j_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_scale_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_res_j_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_res_j_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_res_j_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_res_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
