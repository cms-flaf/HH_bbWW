# Frozen HME windows for the DL channel, v2610 (decided 2026-10-16).
#
# Definition: straight-line fits HME_cut = a + b * MX to the HME windows that maximise S/sqrt(B_TT) with >= 95% of
# the category's signal (Run3_Early, spin 0 bbWW 2l + bbtautau, eE+muMu+eMu, signal and TT summed over the DNN):
#   res2b    low  = 98.1200 + 0.538263 * MX   (fit to MX 250-1500)
#            high = -18.9189 + 1.378378 * MX   (fit to MX 250, 260, 270, 280, 300, where the high cut is
#                   constrained; extrapolated above)
#   boosted  low  = 64.2077 + 0.685021 * MX   (fit to MX 300-1500)
#            high = 135.9084 + 1.109257 * MX   (fit to MX 300-1500)
#   recovery uses the res2b window (no fit of its own; it keeps ~80-92% of the recovery signal).
# Each cut is rounded OUTWARD to the stored DeepHME_mass grid (low cut down, high cut up), so the window is never
# smaller than the fit. A cut at the first (last) grid edge includes the underflow (overflow).
# Stored grid: 78 bins, 0-2000 GeV (10 GeV to 700, 25 to 1000, 50 to 1500, 100 to 2000).
# Study and plots: /eos/user/d/daebi/HH_bbWW/binning_studies/v2610_hme_window_scan/ (window_versions.png,
# tt_window_limits_v2.png, stack_plots/stack_lin.pdf).
fits:
  res2b:    {low: [98.1200, 0.538263], high: [-18.9189, 1.378378]}
  recovery: {low: [98.1200, 0.538263], high: [-18.9189, 1.378378]}  # = res2b
  boosted:  {low: [64.2077, 0.685021], high: [135.9084, 1.109257]}
# windows[MX][category] = [low, high] in GeV, on the stored grid; signal_fraction = share of that category's
# signal inside the window (Run3_Early, spin 0).
