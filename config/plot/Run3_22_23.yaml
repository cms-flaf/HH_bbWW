# Style overrides for the Run3_22_23 meta-era (Run3_2022 + Run3_2022EE + Run3_2023
# + Run3_2023BPix). Lumi is the sum of the luminosities the four eras are normalised to
# (FLAF/config/<era>/global.yaml): 7.98951 + 26.67492 + 17.96422 + 9.67674 = 62.30539 fb^-1.
lumi_text:
  text: "62.3 fb^{-1} (13.6 TeV)"
  pos_ref: inner_right_top
  pos: [ 0, -0.03 ]
  text_size: 0.035
  font: 42
  align: right_bottom

channel_text:
  'e': 'e'
  'mu': '#mu'
  'eE': 'ee'
  'eMu': 'e #mu'
  'muMu': '#mu #mu'

customregion_text:
  'OS_Iso': 'OS, Isolated'
  'SS_Iso': 'SS, Isolated'
  'OS_AntiIso': 'OS, Non-Isolated'
  'SS_AntiIso': 'SS, Non-Isolated'
  'ZVeto_OS_Iso': 'Z Veto, OS, Isolated'
  'ZPeak_OS_Iso': 'Z Peak, OS, Isolated'
  'SR': 'Signal Region'
  'SR_mbb': 'Signal Region + m_bb Cut'
  'TT_CR': 'TT Control Region'
  'DY_CR': 'DY Control Region'
  'W_CR': 'W Control Region'
