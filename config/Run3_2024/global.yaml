triggerFile: config/Run3_2024/triggers.yaml
nano_version: v15
met_type: PuppiMET
# Overrides the base config's `phys_model: Run3_Model`: Run3_Model's private Radion/BulkGraviton
# signals have zero 2024 mass points produced yet, so use the central X->YH NMSSM signals
# instead (real 2024 DAS nanoAOD, see config/phys_models.yaml's Run3_2024_XtoYH_Model). Scoped to
# this era only -- 2022/2023/2025/2026 have no such override and keep using Run3_Model unchanged.
phys_model: Run3_2024_XtoYH_Model
nanoAODVersions:
  data: v15
  mc: v15
# Everything not listed here comes from the top-level corrections block.
corrections:
  <<: *corrections_default
  btag:
    stages: [ AnaTuple, HistTuple, AnalysisCache ]
    modes:
      AnaTuple: none
      AnalysisCache: none
      HistTuple: none
    tagger: UParTAK4
    jetCollection: centralJet
    wantShape: false
  dy_hhbbtautau:
    stages: [ AnalysisCache, HistTuple ]
    processes: [ DY_M_10to50, DYto2L_InclusivePlusBinned ]
    njets_branch: Njets
    ntags_branch: nBTaggedJets
    pt_ll_gen: ll_pt_gen
