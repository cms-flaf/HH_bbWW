triggerFile: config/Run3_2024/triggers.yaml
nano_version: v15
met_type: PuppiMET
nanoAODVersions:
  data: v15
  mc: v15
corrections:
  mu:
    stages: [ HistTuple, AnalysisCache ]
    columns:
      pfRelIso04_all: Muon_pfRelIso04_all
      tightId: Muon_tightId
      tkRelIso: Muon_tkRelIso
      highPtId: Muon_highPtId
      mediumId: Muon_mediumId
      looseId: Muon_looseId
  trigger:
    stages: [ HistTuple, AnalysisCache ]
    mode: SF
  ele: { stages: [ HistTuple, AnalysisCache ] }
  fatjet:
    stages: [ HistTuple, AnalysisCache ]
    ana: bbWW
    tagger: particleNetWithMass_HbbvsQCD
    fatJetName: fatbjet
  muScaRe: {
    stage: AnaTuple,
    mu_pt_for_ScaReApplication: "nano",
    selection: "Muon_looseId",
  }
  eleES: { stages: [ AnaTuple, AnalysisCache ] }
  lumi: { stage: AnaTuple }
  xs: { stage: AnaTuple }
  gen: { stage: AnaTuple }
  pu:
    stages: [ AnaTuple, AnaTupleMerge ]
    enabled:
      AnaTuple: true
      AnaTupleMerge: false
  # PDF acceptance -- keep in sync with config/global.yaml. This era declares its own
  # complete `corrections:` block, and config is concatenated text parsed once, so a
  # duplicate key replaces the top-level block wholesale instead of merging into it.
  # Without this copy, weight_base_pdf*_rel is never defined and the PDF_* entries in
  # this era's weights.yaml reference a column that does not exist.
  #
  # PROVISIONAL: mode/first/n assume a Monte-Carlo replica set (member 0 nominal,
  # members 1-100 the replicas). Confirm per campaign from the LHEPdfWeight branch
  # title -- see pdf.h.
  pdf:
    stages: [ AnaTuple, AnaTupleMerge ]
    branch: LHEPdfWeight
    mode: replicas
    first: 1
    n: 100
    enabled:
      AnaTuple: true
      AnaTupleMerge: false
  base: { stage: AnaTupleMerge }
  JEC: { stage: AnaTuple }
  JER:
    stage: AnaTuple
    apply_jet_horns_fix: true
  btag:
    stages: [ AnaTuple, HistTuple, AnalysisCache ]
    modes:
      AnaTuple: none
      AnalysisCache: none
      HistTuple: none
    tagger: UParTAK4
    jetCollection: centralJet
    wantShape: false
  dy_hhbbtautau:
    stages: [ AnalysisCache, HistTuple ]
    processes: [ DY_M_10to50, DYto2L_InclusivePlusBinned ]
    njets_branch: Njets
    ntags_branch: nBTaggedJets
    pt_ll_gen: ll_pt_gen
