norm:
  PileUp_Lumi_MC:
    expression: weight_base_pu{scale}_rel  * final_weight
    name: CMS_pileup_{}

  MuonID_SF_Iso_ID:
    expression: weight_lep1_MuonID_SF_TightPFIso_TightID{scale}_rel * weight_lep2_MuonID_SF_TightPFIso_TightID{scale}_rel * final_weight
    name: CMS_eff_m_id_iso_{}
  MuonID_SF_ID:
    expression: weight_lep1_MuonID_SF_TightID_Trk{scale}_rel * weight_lep2_MuonID_SF_TightID_Trk{scale}_rel * final_weight
    name: CMS_eff_m_id_{}

  EleID_TightIDIso:
    expression: weight_lep1_EleSF_wp80iso_EleID{scale}_rel * weight_lep2_EleSF_wp80iso_EleID{scale}_rel * final_weight
    name: EleID_TightIDIso_{}
  EleID_TightIDNoIso:
    expression: weight_lep1_EleSF_wp80noiso_EleID{scale}_rel * weight_lep2_EleSF_wp80noiso_EleID{scale}_rel * final_weight
    name: EleID_TightIDNoIso_{}

  SingleEleTrg:
    expression: weight_lep1_TrgSF_singleEleWpTight_singleEle{scale}_rel * weight_lep2_TrgSF_singleEleWpTight_singleEle{scale}_rel * final_weight
    name: SingleEleTrg_{}
  SingleMuonTrg:
    expression: weight_lep1_TrgSF_singleIsoMu_IsoMu24{scale}_rel * weight_lep2_TrgSF_singleIsoMu_IsoMu24{scale}_rel * final_weight
    name: SingleMuonTrg_{}

  # PDF acceptance, shape-only: weight_base_pdf{scale}_rel is already normalised by its
  # own inclusive sum of weights, so only the acceptance difference survives. The rate
  # is carried by the PDF_alphas lnN in the datacards, so the two do not double count.
  #
  # All four entries read the *same* column and differ only in `name:`. The split by
  # initial state is applied in the datacards via `processes:`, because weights.yaml has
  # no process filter -- HistTupleProducer takes every key in `norm:` for every dataset.
  # Emitting a column for only some processes would crash the rest at the unguarded
  # Define in histTupleDef.
  #
  # No era token, unlike the detector nuisances above: one correlated nuisance per
  # initial state, shared across every era.
  PDF_Higgs_ggHH:
    expression: weight_base_pdf{scale}_rel * final_weight
    name: pdf_Higgs_ggHH_{}
  PDF_gg:
    expression: weight_base_pdf{scale}_rel * final_weight
    name: pdf_gg_{}
  PDF_qqbar:
    expression: weight_base_pdf{scale}_rel * final_weight
    name: pdf_qqbar_{}
  PDF_qg:
    expression: weight_base_pdf{scale}_rel * final_weight
    name: pdf_qg_{}

shape:
  JER:
    name: CMS_res_j_{}
  JES_Total:
    name: CMS_scale_j_{}
  EleES:
    name: CMS_scale_e_{}
  ScaRe:
    name: CMS_ScaRe_mu_{}
