# The bbWW signal is X->HH, produced privately for the masses central production does not cover
# (DSProd, models/X_HH/setups/Run3_XHHbbWW.yaml). Radion (spin 0) and BulkGraviton (spin 2) are
# distinct hypotheses, so they are distinct models: a single model carrying both would be fitted as
# one combined signal. Neither has a signal in Run3_2024 and later, where no resonant
# sample has been produced yet: their meta-processes are declared there with an empty dataset list,
# as the central X->YH ones are, so those eras keep loading and the setup-loading test keeps
# covering them.
Run3_Model_Radion:
  name: "Base model for Run 3, spin-0 (Radion) signal"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - W
    - SingleHiggs
    # - QCD_PT
  signals:
    - GluGluToRadion_SingleLepton
    - GluGluToRadion_DoubleLepton
    # - XtoHHto2B2Tau # 2023 is missing some 2B2Tau masses
    # bbtautau is still X->YH-backed and spin 0, so it belongs with the Radion hypothesis only
    - XtoHHto2Tau2B
  data:
    - Data_Full

Run3_Model_BulkGraviton:
  name: "Base model for Run 3, spin-2 (BulkGraviton) signal"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - W
    - SingleHiggs
    # - QCD_PT
  signals:
    - GluGluToBulkGraviton_SingleLepton
    - GluGluToBulkGraviton_DoubleLepton
  data:
    - Data_Full

OnlyData:
  name: "Only Data"
  backgrounds: [ ]
  signals: [ ]
  data:
    - Data_Full

TestModel:
  name: "Test model for CI"
  backgrounds:
    - custom_CI_Background_TT
    - custom_CI_Background_DY
    - custom_CI_Background_W
  signals: # WARNING: for 2024 no signal sample available, using a file from bbtt signals..
    - custom_CI_Signal
  data:
    - custom_CI_Data

Production_Model:
  name: "Model for anatuple production"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    # - VV_inclusive
    - W
    - DY_LO
    - SingleHiggs
  signals:
    - XtoHHto2B2W_SingleLepton
    - XtoHHto2B2W_DoubleLepton
    - GluGluToRadion_DoubleLepton
    - GluGluToRadion_SingleLepton
    - GluGluToBulkGraviton_DoubleLepton
    - GluGluToBulkGraviton_SingleLepton
    # - XtoHHto2B2Tau # 2023 is missing some 2B2Tau masses
    - XtoHHto2Tau2B
  data:
    - Data_Full

DNNTest_Model:
  name: "Model two stage dnn test"
  backgrounds: [ ]
  signals:
    - XtoHHto2B2W_SingleLepton_DNN
  data: [ ]

DNNTraining_Model:
  name: "Base model for Run 3"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - W
    - SingleHiggs
    # - QCD_PT
  signals:
    - XtoHHto2B2W_SingleLepton
    - XtoHHto2B2W_DoubleLepton
    # - XtoHHto2B2Tau # 2023 is missing some 2B2Tau masses
    - XtoHHto2Tau2B
    # Include Radion for DNN Training
    - GluGluToRadion_DoubleLepton
    - GluGluToRadion_SingleLepton
  data:
    - Data_Full
