# The bbWW signal is the privately produced X->HH samples
# (DSProd, models/X_HH/setups/Run3_XHHbbWW.yaml). The central X->YH samples (XtoYHto*) are not
# selected. Run3_Model carries every signal hypothesis: anaTuple and histogram production branch
# per dataset, and the merged histogram is named by the expanded process
# (GluGluToRadion2L_300, GluGluToBulkGraviton1L_1000, ...), so two hypotheses are not added into
# one histogram. Which hypothesis a fit uses is the datacard's process list, not a second physics
# model. No resonant sample is produced in Run3_2024 and later: the meta-processes are declared
# there with an empty dataset list, so those eras keep loading. bbtautau stays commented until
# the private X->HH->bbtautau samples exist.
Run3_Model:
  name: "Base model for Run 3"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - VVV
    - ttV
    - W
    - H
    # - QCD_PT
  signals:
    - GluGluToRadion_SingleLepton
    - GluGluToRadion_DoubleLepton
    - GluGluToBulkGraviton_SingleLepton
    - GluGluToBulkGraviton_DoubleLepton
    # - XtoHHto2B2Tau # 2023 is missing some 2B2Tau masses
    # X->HH->bbtautau is not produced yet. The central X->YH bbtautau sample is not a substitute.
    # - XtoHHto2Tau2B
  data:
    - Data_Full

OnlyData:
  name: "Only Data"
  backgrounds: [ ]
  signals: [ ]
  data:
    - Data_Full

TestModel:
  name: "Test model for CI"
  backgrounds:
    - custom_CI_Background_TT
    - custom_CI_Background_DY
    - custom_CI_Background_W
  signals: # WARNING: for 2024 no signal sample available, using a file from bbtt signals..
    - custom_CI_Signal
  data:
    - custom_CI_Data

DNNTest_Model:
  name: "Model two stage dnn test"
  backgrounds: [ ]
  signals:
    - XtoHHto2B2W_SingleLepton_DNN
  data: [ ]

DNNTraining_Model:
  name: "Base model for Run 3"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - W
    - H
    # - QCD_PT
  signals:
    # - XtoHHto2B2Tau # 2023 is missing some 2B2Tau masses
    # X->HH->bbtautau is not produced yet. The central X->YH bbtautau sample is not a substitute.
    # - XtoHHto2Tau2B
    # Radion X->HH only. The central X->YH processes (XtoHHto2B2W_*) are not selected.
    - GluGluToRadion_DoubleLepton
    - GluGluToRadion_SingleLepton
  data:
    - Data_Full
