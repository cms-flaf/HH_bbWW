# The signals are the X->HH samples, bbWW and bbtautau: central where DAS has the mass point,
# privately produced (DSProd, models/X_HH/setups/Run3_XHHbbWW.yaml and Run3_XHHbbtautau.yaml)
# otherwise. The central X->YH samples (XtoYHto*) are not selected. Run3_Model carries every
# signal hypothesis: anaTuple and histogram production branch
# per dataset, and the merged histogram is named by the expanded process
# (GluGluToRadion_bbWW_2L_300, GluGluToBulkGraviton_bbWW_1L_1000, ...), so two hypotheses
# are not added into one histogram. Which hypothesis a fit uses is the datacard's process list, not a second physics
# model. No resonant sample is produced in Run3_2024 and later: the meta-processes are declared
# there with an empty dataset list, so those eras keep loading.
Run3_Model:
  name: "Base model for Run 3"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - VVV
    - ttV
    - W
    - H
    - Fakes
    # - QCD_PT
  signals: &Run3_Model_signals
    - GluGluToRadion_bbWW_1L
    - GluGluToRadion_bbWW_2L
    - GluGluToBulkGraviton_bbWW_1L
    - GluGluToBulkGraviton_bbWW_2L
    - GluGluToRadion_bbTauTau
    - GluGluToBulkGraviton_bbTauTau
  data: &Run3_Model_data
    - Data_Full

# Run3_Model with DY split by mass for DY studies: DY_M_10to50 and DY_M_50 (the stitched M>50
# inclusive and binned samples) are merged and plotted as two backgrounds instead of one DY.
# The datacards keep Run3_Model's DY. Select it with `phys_model: Run3_Model_DYSplit` in a user_custom
# file (--user-custom), under a --version of its own.
Run3_Model_DYSplit:
  name: "Run 3 model, DY split by mass"
  backgrounds:
    - TT
    - DY_M_10to50
    - DY_M_50
    - ST
    - VV
    - VVV
    - ttV
    - W
    - H
    - Fakes
  signals: *Run3_Model_signals
  data: *Run3_Model_data

# The signals of every mass point in the binary DNN of every mass, for the plot blinding of the SL binary DNNs
# (user, 2026-11-21: the s/sqrt(b) of the other masses' signals in the HME side bins of a mass): filled once,
# nominal only (compute_unc_histograms false; the upstream settings stay the production's), under a --version and
# histogram storage of its own, from the existing histTuples (--HistTupleProducerTask-version <the production's>,
# and its --ana-version) — only after --print-status shows them complete in every era: anything missing would be
# produced into the production's version and storage. Never the model of the limits or of the plots of results: there each binary DNN keeps the signal
# of its own mass (signal_params in config/plot/histograms.yaml); the booking still puts the score of a mass in that
# mass's sub-regions only.
SL_CrossMassSignals:
  name: "Signals of all masses in every binary DNN (blinding study)"
  backgrounds: [ ]
  signals: *Run3_Model_signals
  apply_signal_params: false

OnlyData:
  name: "Only Data"
  backgrounds: [ ]
  signals: [ ]
  data:
    - Data_Full

TestModel:
  name: "Test model for CI"
  backgrounds:
    - custom_CI_Background_TT
    - custom_CI_Background_DY
    - custom_CI_Background_W
    - Fakes
  signals: # WARNING: for 2024 no signal sample available, using a file from bbtt signals..
    - custom_CI_Signal
    - custom_CI_Signal_SL
  data:
    - custom_CI_Data

