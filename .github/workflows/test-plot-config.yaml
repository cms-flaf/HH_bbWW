name: Test Plot Config

on:
  pull_request:
    types: [ "opened", "synchronize", "reopened", "labeled" ]
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-plot-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FLAF at the commit this repository pins: the plot rules the configuration is tested with
      # are the ones it is used with. The submodule URLs are SSH; fetch them over HTTPS.
      - name: Check out the pinned FLAF
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init FLAF
          git -C FLAF log --oneline -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install pyyaml law==0.1.21 luigi==3.8.1

      # Every era, both DY models: the plot groups take every background and one Radion entry
      # per plotted mass in the signal regions, no signal in the control regions.
      - name: Run the plot configuration test
        run: python test/test_plot_config.py
